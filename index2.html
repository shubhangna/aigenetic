  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #0a0a0a;
      --secondary: #fafafa;
      --accent: #0C6B5C;
      --accent-light: #E9F3F0;
      --text-primary: #171717;
      --text-secondary: #737373;
      --border: #e5e5e5;
    }

    body {
      background: var(--secondary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      color: var(--text-primary);
    }

    .text-gradient {
      background: linear-gradient(135deg, #0a0a0a, #262626);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .accent-gradient {
      background: linear-gradient(135deg, #0C6B5C, #084A40);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .hover-rise {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .hover-rise:hover {
      transform: translateY(-8px);
    }

    .minimal-card {
      background: white;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }
    
    .minimal-card:hover {
      border-color: var(--text-primary);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in-up {
      animation: fadeInUp 0.8s ease-out;
    }

    .section-divide {
      position: relative;
    }

    .section-divide::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 1px;
      background: var(--border);
    }

    .section-label {
      text-align: center;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .hero-title {
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 600;
      letter-spacing: -3px;
      line-height: 1.1;
    }

    .feature-icon-box {
      width: 56px;
      height: 56px;
      background: var(--primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
    }

    /* Audio styles */
    .audio-showcase {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
    }

    .audio-showcase-title {
      color: #f8fafc !important;
    }

    .audio-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .audio-card:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .audio-pill {
      background: rgba(12, 107, 92, 0.3);
      color: #17B37F;
      border: 1px solid rgba(12, 107, 92, 0.5);
    }

    .audio-play {
      background: var(--accent);
      transition: all 0.3s ease;
    }

    .audio-play:hover {
      background: #084A40;
      transform: scale(1.05);
    }

    .audio-wave {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 40px;
      margin: 0 auto;
    }

    .audio-wave span {
      width: 3px;
      background: var(--accent);
      border-radius: 2px;
      opacity: 0.7;
      animation: wave 0.8s ease-in-out infinite;
    }

    .audio-wave.wave-active span {
      opacity: 1;
    }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.5); }
      50% { transform: scaleY(1); }
    }

    .audio-time {
      color: rgba(226, 232, 240, 0.6);
    }

    /* Clinic specific card */
    .clinic-handles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }

    .clinic-handle-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      transition: all 0.3s ease;
    }

    .clinic-handle-card:hover {
      border-color: var(--accent);
      box-shadow: 0 12px 24px rgba(12, 107, 92, 0.1);
    }

    .clinic-handle-card h3 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.75rem;
    }

    .clinic-handle-card p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    .clinic-quote {
      background: var(--accent-light);
      border-left: 3px solid var(--accent);
      padding: 0.75rem 1rem;
      font-style: italic;
      color: #0C6B5C;
      font-size: 0.9rem;
    }

    .clinic-limits-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .clinic-limits-list li {
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .clinic-limits-list li:last-child {
      border-bottom: none;
    }

    .clinic-limits-list b {
      display: block;
      font-size: 1.1rem;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .clinic-limits-list span {
      display: block;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .escalate-box {
      background: var(--primary);
      color: #E6EFED;
      border-radius: 12px;
      padding: 2rem;
      margin-top: 2rem;
    }

    .escalate-box h3 {
      color: #fff;
      font-size: 1.25rem;
      margin-bottom: 1rem;
    }

    .escalate-box p {
      margin-bottom: 1rem;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .escalate-line {
      background: rgba(255, 255, 255, 0.1);
      border-top: 1px solid #24383B;
      padding-top: 1rem;
      margin-top: 1.5rem;
      color: #8FE3C6;
      font-family: monospace;
      font-size: 0.85rem;
    }

    .specialty-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .specialty-chip {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.5rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .specialty-chip.active {
      background: var(--accent-light);
      border-color: var(--accent);
      color: #084A40;
    }
  </style>
</head>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [form, setForm] = useState({ name: '', clinic: '', phone: '', city: '', specialty: '', time: '' });
      const phoneLink = `tel:${CONFIG.company.phoneDial}`;
      const whatsappLink = `https://wa.me/${CONFIG.company.whatsappNumber}`;
      const whatsappLinkWithText = `https://wa.me/${CONFIG.company.whatsappNumber}?text=${encodeURIComponent('Hi! I\'m interested in AIgenetic for my clinic')}`;

      const handleChange = (e) => {
        setForm({ ...form, [e.target.name]: e.target.value });
      };

      const submitForm = (e) => {
        e.preventDefault();
        const subject = encodeURIComponent(`AIgenetic for Clinics - Demo Request`);
        const body = encodeURIComponent(
          `Clinic: ${form.clinic}\nDoctor/Owner Name: ${form.name}\nPhone: ${form.phone}\nCity: ${form.city}\nSpecialty: ${form.specialty}\nPreferred Demo Time: ${form.time}`
        );
        window.location.href = `mailto:${CONFIG.company.email}?subject=${subject}&body=${body}`;
      };

      const clinicHandles = [
        { title: 'Books the slot', desc: 'Checks live availability per doctor and per room, offers the next two options, confirms in one turn.', quote: '"Kal shaam ka koi time hai?"' },
        { title: 'Reschedules and cancels', desc: 'Frees the slot instantly and offers it to your waitlist before anyone else calls.', quote: '"Aaj nahi aa paaunga, agle hafte kar dijiye."' },
        { title: 'Quotes fees and timings', desc: 'Consultation, follow-up window, which days you do procedures, whether you\'re at the hospital that morning.', quote: '"Root canal ka kitna charge hai?"' },
        { title: 'Gives directions', desc: 'Landmark-based, the way people actually navigate. Drops a pin on WhatsApp.', quote: '"Clinic metro station se kitna door hai?"' },
        { title: 'Reports and readiness', desc: 'Tells the caller whether their report is ready for pickup — status only, never the contents.', quote: '"Blood test ki report aa gayi kya?"' },
        { title: 'Screens the reps', desc: 'Pharma and equipment reps get your visiting policy instead of your morning.', quote: '"Sir se 5 minute mil sakte hain?"' }
      ];

      const clinicSpecialties = [
        'Dental', 'Paediatrics', 'Dermatology', 'Orthopaedics', 
        'Gynaecology', 'Physiotherapy', 'Eye care', 'Diagnostic labs', 'Multi-speciality'
      ];

      return (
        <div className="min-h-screen" style={{background: 'var(--secondary)'}}>
          {/* Header */}
          <header id="header" className="fixed top-0 left-0 right-0 z-50 backdrop-blur-md" style={{background: 'rgba(250, 250, 250, 0.8)', borderBottom: '1px solid var(--border)'}}>
            <div className="max-w-7xl mx-auto px-8 py-5 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <img src="logo/logoMedium.png" alt="AIgenetic" className="h-10 w-auto" />
                <div className="font-semibold text-lg" style={{letterSpacing: '-0.5px', color: 'var(--primary)'}}>
                  AIgenetic <span className="text-xs font-normal" style={{color: 'var(--accent)'}}>for Clinics</span>
                </div>
              </div>

              <nav className="hidden md:flex items-center gap-12">
                <a href="#handles" className="text-sm font-medium transition-colors" style={{color: 'var(--text-secondary)'}} onMouseEnter={(e) => e.target.style.color = 'var(--text-primary)'} onMouseLeave={(e) => e.target.style.color = 'var(--text-secondary)'}>What it handles</a>
                <a href="#limits" className="text-sm font-medium transition-colors" style={{color: 'var(--text-secondary)'}} onMouseEnter={(e) => e.target.style.color = 'var(--text-primary)'} onMouseLeave={(e) => e.target.style.color = 'var(--text-secondary)'}>What it won't do</a>
                <a href="#pricing" className="text-sm font-medium transition-colors" style={{color: 'var(--text-secondary)'}} onMouseEnter={(e) => e.target.style.color = 'var(--text-primary)'} onMouseLeave={(e) => e.target.style.color = 'var(--text-secondary)'}>Pricing</a>
                <a href={phoneLink} className="px-6 py-2.5 rounded-lg font-medium text-sm transition-all" style={{background: 'var(--accent)', color: 'white'}} onMouseEnter={(e) => {e.target.style.background = '#084A40'; e.target.style.transform = 'translateY(-2px)'}} onMouseLeave={(e) => {e.target.style.background = 'var(--accent)'; e.target.style.transform = 'translateY(0)'}}>Book Demo</a>
              </nav>

              <div className="md:hidden flex gap-2">
                <a href={phoneLink} className="px-4 py-2 rounded-lg text-sm font-semibold" style={{background: 'var(--accent)', color: 'white'}}>📞</a>
              </div>
            </div>
          </header>

          {/* Hero */}
          <section className="relative min-h-screen flex items-center justify-center pt-20" style={{background: 'var(--secondary)'}}>
            <div className="relative max-w-7xl mx-auto px-8 py-32 text-center">
              <div className="max-w-5xl mx-auto space-y-10 fade-in-up">
                <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium" style={{background: 'white', border: '1px solid var(--border)', color: 'var(--text-secondary)'}}>
                  <span className="relative flex h-2 w-2">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75" style={{background: 'var(--accent)'}}></span>
                    <span className="relative inline-flex rounded-full h-2 w-2" style={{background: 'var(--accent)'}}></span>
                  </span>
                  Answering for 240+ clinics right now · v1.19
                </div>

                <h1 className="hero-title" style={{color: 'var(--primary)'}}>
                  The voice of your <span style={{color: 'var(--accent)'}}>clinic</span>
                </h1>

                <p className="text-xl leading-relaxed max-w-3xl mx-auto" style={{color: 'var(--text-secondary)'}}>
                  You're with a patient. The phone rings anyway. AIgenetic picks up on the second ring, books the slot in your register, and sends the confirmation on WhatsApp — in Hindi, Marathi, Tamil and 28 more.
                </p>

                <div className="flex flex-wrap justify-center gap-4 pt-6">
                  <a href={phoneLink} className="group px-10 py-4 rounded-lg font-medium text-lg transition-all inline-flex items-center gap-2" style={{background: 'var(--accent)', color: 'white'}} onMouseEnter={(e) => {e.currentTarget.style.background = '#084A40'; e.currentTarget.style.transform = 'translateY(-2px)'}} onMouseLeave={(e) => {e.currentTarget.style.background = 'var(--accent)'; e.currentTarget.style.transform = 'translateY(0)'}}>
                    📞 Hear it answer your clinic
                    <span className="transition-transform">→</span>
                  </a>
                  <a href={whatsappLink} target="_blank" rel="noopener noreferrer" className="px-10 py-4 rounded-lg font-medium text-lg transition-all" style={{background: 'transparent', color: 'var(--text-primary)', border: '1px solid var(--border)'}} onMouseEnter={(e) => {e.currentTarget.style.borderColor = 'var(--text-primary)'; e.currentTarget.style.transform = 'translateY(-2px)'}} onMouseLeave={(e) => {e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.transform = 'translateY(0)'}}>
                    💬 WhatsApp us
                  </a>
                </div>

                <div className="pt-12 grid grid-cols-2 md:grid-cols-4 gap-6 max-w-4xl mx-auto">
                  <div className="text-center">
                    <div className="text-2xl font-bold" style={{color: 'var(--primary)'}}>Live in 48–72 hours</div>
                    <div className="text-sm mt-2" style={{color: 'var(--text-secondary)'}}>We forward your current number</div>
                  </div>
                  <div className="text-center">
                    <div className="text-2xl font-bold" style={{color: 'var(--primary)'}}>31+ Indian languages</div>
                    <div className="text-sm mt-2" style={{color: 'var(--text-secondary)'}}>Switches mid-call if the caller does</div>
                  </div>
                  <div className="text-center">
                    <div className="text-2xl font-bold" style={{color: 'var(--primary)'}}>Answers at 2 AM</div>
                    <div className="text-sm mt-2" style={{color: 'var(--text-secondary)'}}>Sunday, holidays, OPD hours</div>
                  </div>
                  <div className="text-center">
                    <div className="text-2xl font-bold" style={{color: 'var(--primary)'}}>Priced per call</div>
                    <div className="text-sm mt-2" style={{color: 'var(--text-secondary)'}}>Not per receptionist seat</div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Stats */}
          <section className="py-24" style={{background: 'white'}}>
            <div className="max-w-7xl mx-auto px-8">
              <div className="grid md:grid-cols-4 gap-12">
                <div className="text-center">
                  <div className="text-5xl font-bold" style={{letterSpacing: '-2px', color: 'var(--primary)'}}>240+</div>
                  <div className="text-sm font-medium mt-3" style={{color: 'var(--text-secondary)', textTransform: 'uppercase', letterSpacing: '1px'}}>Clinics Using</div>
                </div>
                <div className="text-center">
                  <div className="text-5xl font-bold" style={{letterSpacing: '-2px', color: 'var(--primary)'}}>10,000+</div>
                  <div className="text-sm font-medium mt-3" style={{color: 'var(--text-secondary)', textTransform: 'uppercase', letterSpacing: '1px'}}>Calls Handled</div>
                </div>
                <div className="text-center">
                  <div className="text-5xl font-bold" style={{letterSpacing: '-2px', color: 'var(--primary)'}}>95%</div>
                  <div className="text-sm font-medium mt-3" style={{color: 'var(--text-secondary)', textTransform: 'uppercase', letterSpacing: '1px'}}>Booking Success</div>
                </div>
                <div className="text-center">
                  <div className="text-5xl font-bold" style={{letterSpacing: '-2px', color: 'var(--primary)'}}>2 min</div>
                  <div className="text-sm font-medium mt-3" style={{color: 'var(--text-secondary)', textTransform: 'uppercase', letterSpacing: '1px'}}>Avg Call Duration</div>
                </div>
              </div>
            </div>
          </section>

          {/* What it handles */}
          <section id="handles" className="py-32 section-divide" style={{background: 'var(--secondary)'}}>
            <div className="max-w-7xl mx-auto px-8">
              <div className="text-center max-w-3xl mx-auto mb-20">
                <div className="section-label mb-6">The 90% of calls that aren't clinical</div>
                <h2 className="text-5xl font-semibold mb-6" style={{letterSpacing: '-2px', color: 'var(--primary)'}}>Most calls to a clinic are logistics</h2>
                <p className="text-lg" style={{color: 'var(--text-secondary)'}}>Your receptionist spends the day answering the same nine questions. AIgenetic takes them all, in the caller's language, and leaves you the ones that need a human.</p>
              </div>

              <div className="clinic-handles">
                {clinicHandles.map((handle, idx) => (
                  <div key={idx} className="clinic-handle-card">
                    <h3>{handle.title}</h3>
                    <p>{handle.desc}</p>
                    <div className="clinic-quote">{handle.quote}</div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* What it won't do */}
          <section id="limits" className="py-32 section-divide" style={{background: 'white'}}>
            <div className="max-w-7xl mx-auto px-8">
              <div className="grid md:grid-cols-2 gap-16">
                <div>
                  <div className="section-label mb-6" style={{textAlign: 'left'}}>Hard limits, set by us, not by prompt</div>
                  <h2 style={{fontSize: '2.2rem', fontWeight: 600, letterSpacing: '-1.5px', color: 'var(--text-primary)', marginTop: '1rem', marginBottom: '1rem'}}>What it will never do</h2>
                  <p style={{marginTop: '1rem', color: 'var(--text-secondary)', fontSize: '1.05rem', lineHeight: 1.6}}>Your name is on the board outside. These three refusals are built into the product and cannot be turned on, by you or by us.</p>
                  <ul className="clinic-limits-list">
                    <li>
                      <b>No diagnosis, no advice</b>
                      <span>Symptoms are logged for you and the caller is offered the earliest slot. Nothing more.</span>
                    </li>
                    <li>
                      <b>No medicine names, no dosages</b>
                      <span>Not even repeats of what you prescribed last visit. Refills go to you.</span>
                    </li>
                    <li>
                      <b>No results read over the phone</b>
                      <span>"Ready for collection" is the whole answer. Values stay in the file.</span>
                    </li>
                  </ul>
                </div>
                <div>
                  <div className="escalate-box">
                    <h3>And one thing it always does</h3>
                    <p>If a caller describes chest pain, breathlessness, heavy bleeding, a seizure, or an unresponsive patient, the assistant stops booking mid-sentence, reads out the nearest emergency number, and rings your on-duty mobile until someone picks up.</p>
                    <div className="escalate-line">
                      ESCALATION · 04:12 · caller reported chest pain<br/>
                      → 108 read aloud · Dr. Rao paged · call transferred in 9s
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Setup & Integrations */}
          <section className="py-32 section-divide" style={{background: 'var(--secondary)'}}>
            <div className="max-w-7xl mx-auto px-8">
              <div className="text-center max-w-3xl mx-auto mb-20">
                <div className="section-label mb-6">Setup</div>
                <h2 className="text-5xl font-semibold mb-6" style={{letterSpacing: '-2px', color: 'var(--primary)'}}>Keep your number. Keep your register.</h2>
                <p className="text-lg" style={{color: 'var(--text-secondary)'}}>We forward your existing clinic line and write bookings into whatever you already use. If that's a diary and a WhatsApp group, that works too — we'll send the day's list at 8 AM.</p>
              </div>

              <div className="specialty-chips">
                <span className="specialty-chip active">Practo Ray</span>
                <span className="specialty-chip active">HealthPlix</span>
                <span className="specialty-chip active">Bajaj Health</span>
                <span className="specialty-chip active">DocPulse</span>
                <span className="specialty-chip active">Google Calendar</span>
                <span className="specialty-chip active">WhatsApp Business</span>
                <span className="specialty-chip">Excel / Sheets</span>
                <span className="specialty-chip">Paper register + daily list</span>
              </div>

    function AudioShowcase() {
      const audioRefs = React.useRef([]);
      const [playingIndex, setPlayingIndex] = React.useState(null);
      const [timeData, setTimeData] = React.useState(
        CONFIG.audioDemos.map(() => ({ current: 0, duration: 0 }))
      );
      const waveBase = [6, 14, 10, 18, 12, 20, 8, 16, 11, 22, 9, 17, 13, 19, 7, 15, 10, 18, 12, 20, 9, 16];

      const formatTime = (timeValue) => {
        if (!timeValue || Number.isNaN(timeValue)) return '0:00';
        const minutes = Math.floor(timeValue / 60);
        const seconds = Math.floor(timeValue % 60).toString().padStart(2, '0');
        return `${minutes}:${seconds}`;
      };

      const getWaveHeights = (index) =>
        waveBase.map((height, i) => height + ((index + i) % 4));

      const togglePlay = (index) => {
        const audio = audioRefs.current[index];
        if (!audio) return;
        if (playingIndex !== null && playingIndex !== index) {
          const activeAudio = audioRefs.current[playingIndex];
          if (activeAudio) activeAudio.pause();
        }
        if (audio.paused) {
          audio.play();
          setPlayingIndex(index);
        } else {
          audio.pause();
          setPlayingIndex(null);
        }
      };

      const updateTime = (index) => {
        const audio = audioRefs.current[index];
        if (!audio) return;
        setTimeData((prev) => {
          const next = [...prev];
          next[index] = { current: audio.currentTime, duration: audio.duration || 0 };
          return next;
        });
      };

      const handleEnded = (index) => {
        setPlayingIndex((prev) => (prev === index ? null : prev));
      };

      return (
        <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-8">
          {CONFIG.audioDemos.map((demo, index) => (
            <div key={demo.title + index} className="audio-card p-8 rounded-2xl flex flex-col gap-6">
              <div className="flex items-start justify-between gap-4">
                <div>
                  <div className="audio-pill text-xs font-semibold uppercase tracking-widest px-3 py-1 rounded-full inline-flex">
                    {demo.category}
                  </div>
                  <h3 className="text-xl font-semibold mt-4" style={{color: '#f8fafc'}}>{demo.title}</h3>
                  <p className="text-sm mt-2" style={{color: 'rgba(226, 232, 240, 0.7)'}}>{demo.desc}</p>
                </div>
                <button
                  type="button"
                  className="audio-play w-12 h-12 rounded-full flex items-center justify-center text-white text-xs font-semibold"
                  onClick={() => togglePlay(index)}
                  aria-label={playingIndex === index ? `Pause ${demo.title}` : `Play ${demo.title}`}
                >
                  {playingIndex === index ? 'Pause' : 'Play'}
                </button>
              </div>

              <div className={`audio-wave ${playingIndex === index ? 'wave-active' : ''}`}>
                {getWaveHeights(index).map((height, waveIndex) => (
                  <span
                    key={`${demo.title}-wave-${waveIndex}`}
                    style={{
                      height: `${height}px`,
                      animationDelay: `${waveIndex * 0.08}s`
                    }}
                  />
                ))}
              </div>

              <div className="flex items-center justify-between text-xs audio-time">
                <span>{formatTime(timeData[index].current)}</span>
                <span>{formatTime(timeData[index].duration)}</span>
              </div>

              <audio
                ref={(el) => { audioRefs.current[index] = el; }}
                src={encodeURI(demo.file)}
                preload="metadata"
                onTimeUpdate={() => updateTime(index)}
                onLoadedMetadata={() => updateTime(index)}
                onEnded={() => handleEnded(index)}
              />
            </div>
          ))}
        </div>
      );
    }
