  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #0E1B1E;
      --secondary: #FAFAF7;
      --accent: #0C6B5C;
      --accent-deep: #084A40;
      --mint: #E9F3F0;
      --text-primary: #0E1B1E;
      --text-secondary: #546567;
      --border: #E3E5E0;

      /* Shared design system tokens matching healthcare.html / realestate.html */
      --ink: #0E1B1E;
      --paper: #FAFAF7;
      --teal: #0C6B5C;
      --teal-deep: #084A40;
      --line: #E3E5E0;
      --muted: #546567;
      --display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
      --body: "Instrument Sans", system-ui, -apple-system, Segoe UI, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --wrap: 1180px;

      /* derived surface + motion tokens — mirrors healthcare.html's
         theme.clinicalTeal additions; no new brand hues introduced.
         See newSite/template.json theme.default for the source of truth. */
      --card: #FFFFFF;
      --line-soft: #EDEEEA;
      --mint-deep: #DCEDE7;
      --r-sm: 12px;
      --r-md: 18px;
      --r-lg: 26px;
      --sh-1: 0 1px 2px rgba(14,27,30,.05), 0 8px 24px -18px rgba(14,27,30,.35);
      --sh-2: 0 2px 6px rgba(14,27,30,.05), 0 26px 60px -38px rgba(14,27,30,.45);
      --sh-3: 0 30px 80px -46px rgba(12,107,92,.55);
      --ease: cubic-bezier(.2,.7,.3,1);
    }

    body {
      background: var(--secondary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      color: var(--text-primary);
      overflow-x: hidden;
    }

    /* ambient wash — sits behind everything, costs nothing (same pattern as healthcare.html) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(760px 520px at 78% -6%, rgba(23,179,127,.10), transparent 62%),
        radial-gradient(620px 460px at 6% 2%, rgba(12,107,92,.08), transparent 60%);
    }
    #root { position: relative; z-index: 1; }

    .text-gradient {
      background: linear-gradient(135deg, #0E1B1E, #0C6B5C);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .accent-gradient {
      background: linear-gradient(135deg, #0C6B5C, #084A40);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .hover-rise {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .hover-rise:hover {
      transform: translateY(-8px);
    }
    
    .line-accent {
      position: relative;
      display: inline-block;
    }
    
    .line-accent::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      width: 80px;
      height: 2px;
      background: var(--primary);
    }
    
    .minimal-card {
      background: white;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }
    
    .minimal-card:hover {
      border-color: var(--text-primary);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .fade-in-up {
      animation: fadeInUp 0.8s ease-out;
    }
    
    .section-divide {
      position: relative;
    }
    
    .section-divide::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 1px;
      background: var(--border);
    }

    .section-label {
      text-align: center;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .hero-title {
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 600;
      letter-spacing: -3px;
      line-height: 1.1;
    }

    .feature-icon-box {
      width: 56px;
      height: 56px;
      background: var(--primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
    }

    .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 24px; }

    /* ---------- nav: header matching vertical pages ---------- */
    .nav {
      position: sticky; top: 0; z-index: 60; background: rgba(250, 250, 247, .72);
      backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px);
      border-bottom: 1px solid transparent;
      transition: border-color .3s var(--ease), background .3s var(--ease), box-shadow .3s var(--ease);
    }
    .nav.scrolled {
      border-bottom-color: var(--border);
      background: rgba(250, 250, 247, .92);
      box-shadow: 0 10px 30px -28px rgba(14, 27, 30, .7);
    }
    .nav-in {
      display: flex; align-items: center; gap: 28px; height: 72px;
      max-width: var(--wrap); margin: 0 auto; padding: 0 24px;
      transition: height .3s var(--ease);
    }
    .nav.scrolled .nav-in { height: 64px; }
    .brand {
      display: flex; align-items: center; gap: 11px;
      font-family: var(--display); font-weight: 800; font-size: 19px;
      letter-spacing: -.025em; text-decoration: none; color: var(--primary);
    }
    .brand img { height: 32px; width: auto; display: block; }
    .brand small {
      font-family: var(--body); font-weight: 600; font-size: 11px;
      color: var(--accent-deep); letter-spacing: .1em; text-transform: uppercase;
      padding: 4px 9px; border-radius: 999px; background: var(--mint);
      border: 1px solid var(--mint-deep); line-height: 1;
    }
    .nav-links { margin-left: auto; display: flex; gap: 6px; font-size: 15px; font-weight: 500; }
    .nav-links a {
      text-decoration: none; color: var(--text-secondary); padding: 8px 14px;
      border-radius: 999px; transition: color .2s var(--ease), background .2s var(--ease);
    }
    .nav-links a:hover { color: var(--text-primary); background: rgba(233, 243, 240, .85); }
    .nav-cta { display: flex; gap: 10px; margin-left: auto; align-items: center; }
    .nav-links + .nav-cta { margin-left: 22px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      font-family: var(--body); font-weight: 600; font-size: 15px; padding: 12px 22px;
      border-radius: 999px; text-decoration: none; border: 1px solid transparent;
      transition: transform .18s var(--ease), background .2s var(--ease), box-shadow .25s var(--ease), border-color .2s var(--ease), color .2s var(--ease);
      cursor: pointer; line-height: 1.15; white-space: nowrap;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--primary); color: var(--secondary); box-shadow: 0 10px 24px -16px rgba(14, 27, 30, .9); }
    .btn-primary:hover { background: var(--accent-deep); box-shadow: 0 16px 34px -16px rgba(8, 74, 64, .75); color: white; }
    .btn-ghost { background: #fff; color: var(--primary); border-color: var(--border); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent-deep); box-shadow: 0 14px 30px -22px rgba(12, 107, 92, .8); }
    .btn-lg { font-size: 16.5px; padding: 16px 30px; }
    .nav .btn { font-size: 14px; padding: 10px 18px; }

    .nav-toggle {
      display: none; width: 42px; height: 42px; border-radius: 12px;
      border: 1px solid var(--border); background: #fff; cursor: pointer;
      padding: 0; align-items: center; justify-content: center; flex-direction: column; gap: 4px;
    }
    .nav-toggle i { display: block; width: 16px; height: 2px; background: var(--primary); border-radius: 2px; transition: transform .25s var(--ease), opacity .2s var(--ease); }
    .nav-toggle.open i:nth-child(1), .nav-toggle[aria-expanded="true"] i:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .nav-toggle.open i:nth-child(2), .nav-toggle[aria-expanded="true"] i:nth-child(2) { opacity: 0; }
    .nav-toggle.open i:nth-child(3), .nav-toggle[aria-expanded="true"] i:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
    .nav-panel { border-top: 1px solid var(--border); background: rgba(250, 250, 247, .98); padding: 10px 0 18px; }
    .nav-panel a { display: block; padding: 12px 4px; text-decoration: none; color: var(--primary); font-weight: 500; border-bottom: 1px solid var(--line-soft); }
    .nav-panel a:last-child { border-bottom: 0; }
    .nav-panel .panel-cta { display: flex; gap: 10px; margin-top: 16px; }
    .nav-panel .panel-cta .btn { display: inline-flex; flex: 1; border-bottom: 0; padding: 13px 14px; font-size: 15px; }

    /* ---------- site footer (matches healthcare.html & realestate.html) ---------- */
    .site-footer { border-top: 1px solid var(--border); background: var(--mint); padding: 64px 0 30px; }
    .footer-grid { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 44px; }
    .footer-brand p { margin-top: 16px; color: var(--text-secondary); font-size: 14px; max-width: 340px; line-height: 1.65; }
    .footer-col h5 { font-family: var(--display); font-size: 12.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--accent-deep); margin: 0 0 16px; font-weight: 700; }
    .footer-col a { display: block; color: var(--text-secondary); font-size: 14.5px; text-decoration: none; margin-bottom: 11px; width: fit-content; transition: color .2s var(--ease), transform .2s var(--ease); }
    .footer-col a:hover { color: var(--accent-deep); transform: translateX(3px); }
    .footer-bottom { margin-top: 48px; padding-top: 26px; border-top: 1px solid var(--mint-deep); display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; font-size: 13px; color: var(--text-secondary); }
    .footer-bottom .sp { margin-left: auto; text-align: right; }

    @media (max-width: 900px) {
      .nav-links { display: none; }
      .nav-toggle { display: flex; }
      .nav-cta { margin-left: auto; }
    }
    @media (max-width: 820px) {
      .footer-grid { grid-template-columns: 1fr 1fr; gap: 34px 24px; }
      .footer-brand { grid-column: 1 / -1; }
      .footer-bottom { flex-direction: column; align-items: flex-start; gap: 12px; }
      .footer-bottom .sp { margin-left: 0; text-align: left; }
    }
    @media (max-width: 680px) {
      .nav-cta > .btn { display: none; }
    }
    @media (max-width: 560px) {
      .footer-grid { grid-template-columns: 1fr; }
    }

    /* ---------- hero: masked grid wash (mirrors healthcare.html .hero::after) ---------- */
    .hero-grid-wash::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background-image:
        linear-gradient(rgba(14,27,30,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(14,27,30,.04) 1px, transparent 1px);
      background-size: 64px 64px;
      -webkit-mask-image: radial-gradient(720px 420px at 50% 8%, #000 0%, transparent 78%);
              mask-image: radial-gradient(720px 420px at 50% 8%, #000 0%, transparent 78%);
    }

    /* ---------- hero key-feature rail as hover-lift cards (mirrors healthcare.html .rail) ---------- */
    .stat-card {
      position: relative;
      padding: 20px 18px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      box-shadow: var(--sh-1);
      overflow: hidden;
      transition: transform .3s var(--ease), border-color .3s var(--ease), box-shadow .3s var(--ease);
    }
    .stat-card::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--accent);
      transform: scaleY(0);
      transform-origin: top;
      transition: transform .35s var(--ease);
    }
    .stat-card:hover { transform: translateY(-4px); border-color: var(--mint-deep); box-shadow: var(--sh-2); }
    .stat-card:hover::before { transform: scaleY(1); }

    /* ---------- use-case card index badge (mirrors healthcare.html .cell .idx) ---------- */
    .card-idx {
      font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
      font-size: 11.5px;
      letter-spacing: .14em;
      color: var(--accent);
      opacity: .75;
      display: block;
      margin-bottom: 10px;
    }

    /* ---------- use-case card: disabled / coming-soon state ---------- */
    .use-case-disabled {
      position: relative;
      opacity: .55;
      filter: grayscale(.4);
      cursor: not-allowed;
    }
    .use-case-disabled .card-idx { opacity: .4; }
    .coming-soon-pill {
      position: absolute;
      top: 24px;
      right: 24px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      background: var(--secondary);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
    }

    /* ---------- use-case marquee: continuous horizontal rolling strip ----------
       The card list is rendered twice back-to-back (UseCaseMarquee in the JSX
       below) and the track drifts by exactly -50% so the loop is seamless.
       Paused via React state (onMouseEnter/onFocus) rather than a CSS :hover,
       so keyboard focus pauses it too without relying on :has() support. */
    .usecase-marquee {
      overflow: hidden;
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 5%, #000 95%, transparent 100%);
              mask-image: linear-gradient(90deg, transparent 0, #000 5%, #000 95%, transparent 100%);
    }
    .usecase-track {
      display: flex;
      gap: 24px;
      width: max-content;
      /* Slow, weighted drift rather than a conveyor-belt scroll: an ease-in-out
         curve repeated across several keyframe stops (not just two endpoints)
         so speed swells and eases within each leg, like a hydraulic ram under
         pressure rather than a motor spinning at constant RPM. */
      animation: usecase-scroll 60s cubic-bezier(.65,0,.35,1) infinite;
      will-change: transform;
    }
    .usecase-track.paused { animation-play-state: paused; }
    .usecase-card-wrap {
      flex: 0 0 auto;
      width: min(82vw, 300px);
    }
    @keyframes usecase-scroll {
      0%   { transform: translateX(0); }
      25%  { transform: translateX(-14%); }
      50%  { transform: translateX(-25%); }
      75%  { transform: translateX(-36%); }
      100% { transform: translateX(-50%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .usecase-track { animation: none; }
      .usecase-marquee { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    }

    /* ---------- closing CTA: dark rounded panel (mirrors healthcare.html .close-in) ---------- */
    .closing-panel {
      background: var(--primary);
      color: #EAF2F0;
      border-radius: 34px;
      padding: 88px 32px 76px;
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    .closing-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(620px 320px at 50% 0%, rgba(23,179,127,.22), transparent 66%),
        radial-gradient(420px 260px at 12% 100%, rgba(12,107,92,.3), transparent 70%);
    }
    .closing-panel > * { position: relative; }
    @media (max-width: 900px) { .closing-panel { padding: 64px 22px 56px; border-radius: 26px; } }

    /* ---------- scroll-reveal motion (mirrors healthcare.html .reveal / .stagger) ---------- */
    .reveal { opacity: 0; transform: translateY(20px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
    .reveal.in { opacity: 1; transform: none; }
    .stagger > * { opacity: 0; transform: translateY(18px); transition: opacity .6s var(--ease), transform .6s var(--ease); }
    .stagger.in > * { opacity: 1; transform: none; }
    .stagger.in > *:nth-child(1) { transition-delay: .04s; }
    .stagger.in > *:nth-child(2) { transition-delay: .10s; }
    .stagger.in > *:nth-child(3) { transition-delay: .16s; }
    .stagger.in > *:nth-child(4) { transition-delay: .22s; }
    .stagger.in > *:nth-child(5) { transition-delay: .28s; }
    .stagger.in > *:nth-child(6) { transition-delay: .34s; }
    @media (prefers-reduced-motion: reduce) {
      .reveal, .stagger > * { transition: none !important; opacity: 1 !important; transform: none !important; }
      .stat-card:hover, .hover-rise:hover { transform: none !important; }
    }

    /* ---------- calendar modal polish ---------- */
    #calendar-modal-main { backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    .calendar-modal-main-content { animation: modal-in .35s var(--ease); }
    @keyframes modal-in { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body class="antialiased text-slate-900 custom-scrollbar">
    
  <div id="root"></div>
  <div id="mode-root" style="display:none"></div>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="config.js"></script>

  <!-- ---------- vertical mode router ----------
       aigenetic.in/healthcare.html, aigenetic.in/realestate.html and
       aigenetic.in/coaching.html redirect here with ?mode=healthcare /
       ?mode=realestate / ?mode=coaching (see the redirect script at the top
       of those files) so the whole site lives under one URL.
       Instead of re-authoring their content as JSX, this fetches that page's
       own markup — still the single source of truth for its copy — and
       swaps it into #mode-root. See CLAUDE.md's "vertical mode router" note. -->
  <script>
    function getAigeneticMode() {
      var params = new URLSearchParams(location.search);
      var mode = params.get('mode');
      return (mode === 'healthcare' || mode === 'realestate' || mode === 'coaching') ? mode : 'home';
    }
    window.__AIGENETIC_MODE__ = getAigeneticMode();

    async function loadModeContent(mode) {
      var file = mode === 'healthcare' ? 'healthcare.html' : (mode === 'coaching' ? 'coaching.html' : 'realestate.html');
      try {
        var res = await fetch(file);
        if (!res.ok) throw new Error('fetch failed: ' + res.status);
        var html = await res.text();
        var doc = new DOMParser().parseFromString(html, 'text/html');

        if (doc.title) document.title = doc.title;
        ['description', 'keywords', 'og:title', 'og:description', 'og:url',
         'twitter:title', 'twitter:description'].forEach(function (name) {
          var selector = name.indexOf(':') > -1
            ? 'meta[property="' + name + '"]'
            : 'meta[name="' + name + '"]';
          var src = doc.querySelector(selector);
          var dest = document.querySelector(selector);
          if (src && dest) dest.setAttribute('content', src.getAttribute('content'));
        });
        var canonical = document.querySelector('link[rel="canonical"]');
        if (canonical) canonical.href = 'https://aigenetic.in/?mode=' + mode;

        var styleTag = document.getElementById('mode-style');
        if (!styleTag) {
          styleTag = document.createElement('style');
          styleTag.id = 'mode-style';
          document.head.appendChild(styleTag);
        }
        styleTag.textContent = Array.from(doc.querySelectorAll('style'))
          .map(function (s) { return s.textContent; })
          .join('\n');

        var root = document.getElementById('root');
        if (root) root.style.display = 'none';
        var modeRoot = document.getElementById('mode-root');
        modeRoot.innerHTML = doc.body.innerHTML;
        modeRoot.style.display = '';

        // Deliberately NOT rewriting the injected page's logo / "Home" links:
        // they keep their original href="#top" (scroll within this vertical)
        // rather than pointing back at the main site — clicking the logo
        // while in healthcare/realestate mode should stay in that mode.

        // innerHTML does not execute <script> tags — recreate them so the
        // page's own calendar-modal / waveform / nav behavior comes alive.
        modeRoot.querySelectorAll('script').forEach(function (oldScript) {
          var newScript = document.createElement('script');
          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.textContent = oldScript.textContent;
          }
          oldScript.replaceWith(newScript);
        });

    function Reveal({ as: Tag = 'div', stagger = false, className = '', children, ...rest }) {
      const ref = useRef(null);
      const [inView, setInView] = useState(false);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const io = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              setInView(true);
              io.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12 });
        io.observe(el);
        return () => io.disconnect();
      }, []);

      const cls = `${stagger ? 'stagger' : 'reveal'} ${inView ? 'in' : ''} ${className}`.trim();
      return <Tag ref={ref} className={cls} {...rest}>{children}</Tag>;
    }

    }

    function LiveVoiceCallButton({ label, className, style, onMouseEnter, onMouseLeave }) {
      const [text, setText] = useState(label);
      const timeoutRef = React.useRef(null);

      const handleClick = () => {
        if (timeoutRef.current) return;
        setText('Call to voice assistant coming soon');
        timeoutRef.current = setTimeout(() => {
          setText(label);
          timeoutRef.current = null;
        }, 1000);
      };

      return (
        <button type="button" onClick={handleClick} className={className} style={style} onMouseEnter={onMouseEnter} onMouseLeave={onMouseLeave}>
          {text}
        </button>
      );
    }

    // Use Cases: a continuously-drifting horizontal strip rather than a static
    // grid. The card list is rendered twice back-to-back and the track drifts
    // exactly -50% on a linear infinite loop, so it wraps seamlessly. Paused
    // via React state on hover/focus (see .usecase-track.paused in the <style>
    // block) so keyboard users and anyone hovering a card get a stable target.
    function UseCaseMarquee() {
      const [paused, setPaused] = useState(false);
      const count = CONFIG.useCases.length;
      const cards = [...CONFIG.useCases, ...CONFIG.useCases];

      return (
        <div
          className="usecase-marquee"
          onMouseEnter={() => setPaused(true)}
          onMouseLeave={() => setPaused(false)}
          onFocus={() => setPaused(true)}
          onBlur={() => setPaused(false)}
        >
          <div className={`usecase-track${paused ? ' paused' : ''}`}>
            {cards.map((useCase, idx) => {
              const duplicate = idx >= count;
              const CardTag = useCase.link ? 'a' : 'div';
              const cardProps = useCase.link
                ? {
                    href: useCase.link,
                    className: 'minimal-card p-8 rounded-2xl hover-rise block',
                    style: {textDecoration: 'none'},
                    'aria-label': `${useCase.title} — see the dedicated page`,
                    tabIndex: duplicate ? -1 : undefined
                  }
                : {
                    className: `minimal-card p-8 rounded-2xl${useCase.comingSoon ? ' use-case-disabled' : ' hover-rise'}`,
                    'aria-disabled': useCase.comingSoon ? 'true' : undefined
                  };
              return (
                <div className="usecase-card-wrap" key={useCase.title + idx} aria-hidden={duplicate ? 'true' : undefined}>
                  <CardTag {...cardProps}>
                    <span className="card-idx">{String((idx % count) + 1).padStart(2, '0')}</span>
                    {useCase.comingSoon && (
                      <span className="coming-soon-pill">Coming Soon</span>
                    )}
                    <div className="feature-icon-box mb-6">
                      <span style={{filter: 'grayscale(1) brightness(10)'}}>{useCase.icon}</span>
                    </div>
                    <h3 className="text-xl font-semibold mb-3" style={{letterSpacing: '-0.5px', color: 'var(--text-primary)'}}>{useCase.title}</h3>
                    <p className="text-sm mb-6 leading-relaxed" style={{color: 'var(--text-secondary)'}}>{useCase.desc}</p>
                    <ul className="space-y-2 text-sm" style={{color: 'var(--text-secondary)'}}>
                      {useCase.features.map((feature, jdx) => (
                        <li key={feature + jdx} className="flex items-start gap-2">
                          <span style={{color: 'var(--primary)'}}>✓</span>
                          <span>{feature}</span>
                        </li>
                      ))}
                    </ul>
                    {useCase.link && (
                      <div className="text-sm font-semibold mt-6" style={{color: 'var(--primary)'}}>{useCase.linkCtaLabel || 'Explore →'}</div>
                    )}
                  </CardTag>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function AudioShowcase() {
      const audioRefs = React.useRef([]);
      const [playingIndex, setPlayingIndex] = React.useState(null);
      const [timeData, setTimeData] = React.useState(
        CONFIG.audioDemos.map(() => ({ current: 0, duration: 0 }))
      );
      const waveBase = [6, 14, 10, 18, 12, 20, 8, 16, 11, 22, 9, 17, 13, 19, 7, 15, 10, 18, 12, 20, 9, 16];

      const formatTime = (timeValue) => {
        if (!timeValue || Number.isNaN(timeValue)) return '0:00';
        const minutes = Math.floor(timeValue / 60);
        const seconds = Math.floor(timeValue % 60).toString().padStart(2, '0');
        return `${minutes}:${seconds}`;
      };

      const getWaveHeights = (index) =>
        waveBase.map((height, i) => height + ((index + i) % 4));

      const togglePlay = (index) => {
        const audio = audioRefs.current[index];
        if (!audio) return;
        if (playingIndex !== null && playingIndex !== index) {
          const activeAudio = audioRefs.current[playingIndex];
          if (activeAudio) activeAudio.pause();
        }
        if (audio.paused) {
          audio.play();
          setPlayingIndex(index);
        } else {
          audio.pause();
          setPlayingIndex(null);
        }
      };

      const updateTime = (index) => {
        const audio = audioRefs.current[index];
        if (!audio) return;
        setTimeData((prev) => {
          const next = [...prev];
          next[index] = { current: audio.currentTime, duration: audio.duration || 0 };
          return next;
        });
      };

      const handleEnded = (index) => {
        setPlayingIndex((prev) => (prev === index ? null : prev));
      };

      return (
        <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-8">
          {CONFIG.audioDemos.map((demo, index) => (
            <div key={demo.title + index} className="audio-card p-8 rounded-2xl flex flex-col gap-6">
              <div className="flex items-start justify-between gap-4">
                <div>
                  <div className="audio-pill text-xs font-semibold uppercase tracking-widest px-3 py-1 rounded-full inline-flex">
                    {demo.category}
                  </div>
                  <h3 className="text-xl font-semibold mt-4" style={{color: 'var(--text-primary)'}}>{demo.title}</h3>
                  <p className="text-sm mt-2" style={{color: 'var(--text-secondary)'}}>{demo.desc}</p>
                </div>
                <button
                  type="button"
                  className="audio-play w-12 h-12 rounded-full flex items-center justify-center text-white text-xs font-semibold"
                  onClick={() => togglePlay(index)}
                  aria-label={playingIndex === index ? `Pause ${demo.title}` : `Play ${demo.title}`}
                >
                  {playingIndex === index ? 'Pause' : 'Play'}
                </button>
              </div>

              <div className={`audio-wave ${playingIndex === index ? 'wave-active' : ''}`}>
                {getWaveHeights(index).map((height, waveIndex) => (
                  <span
                    key={`${demo.title}-wave-${waveIndex}`}
                    style={{
                      height: `${height}px`,
                      animationDelay: `${waveIndex * 0.08}s`
                    }}
                  />
                ))}
              </div>

              <div className="flex items-center justify-between text-xs audio-time">
                <span>{formatTime(timeData[index].current)}</span>
                <span>{formatTime(timeData[index].duration)}</span>
              </div>

              <audio
                ref={(el) => { audioRefs.current[index] = el; }}
                src={encodeURI(demo.file)}
                preload="metadata"
                onTimeUpdate={() => updateTime(index)}
                onLoadedMetadata={() => updateTime(index)}
                onEnded={() => handleEnded(index)}
              />
            </div>
          ))}
        </div>
      );
    }

    if (window.__AIGENETIC_MODE__ === 'home') {
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    } else {
      loadModeContent(window.__AIGENETIC_MODE__);
    }
  </script>

  <!-- Calendar Booking Modal for Main Site -->
  <div id="calendar-modal-main" role="dialog" aria-modal="true" aria-labelledby="calendar-modal-main-title" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,10,10,0.6);z-index:9999;align-items:center;justify-content:center;padding:20px">
    <div class="calendar-modal-main-content" style="background:#fff;border-radius:20px;padding:32px;max-width:680px;width:100%;max-height:calc(100dvh - 40px);overflow-y:auto;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);position:relative">
      <button onclick="closeCalendarModalMain()" aria-label="Close booking dialog" style="position:absolute;top:16px;right:16px;width:32px;height:32px;border:none;background:transparent;cursor:pointer;font-size:24px;color:#666">✕</button>
      <h2 id="calendar-modal-main-title" style="font-size:28px;margin-bottom:8px;color:var(--primary)">Schedule Your Demo</h2>
      <p style="color:var(--text-secondary);margin-bottom:24px">Pick a time that works for you — Google Calendar takes care of the invite and the Meet link.</p>

      <!-- Google Calendar Appointment Scheduling begin -->
      <iframe class="calendar-modal-main-iframe" src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2-oLNDtD7wJRTQhnQ4WwsQE_f0x_wePzs82A2ihrxI7WZJb-XRed0ak2ltUfH1zohb-16awYx4?gv=true" style="border: 0;display:block;width:100%;height:600px;max-height:calc(100dvh - 180px)" frameborder="0" title="Book a demo with Aigenetic"></iframe>
      <!-- end Google Calendar Appointment Scheduling -->
    </div>
  </div>

  <script>
    // Calendar Modal Functions for Main Site
    function openCalendarModalMain() {
      document.getElementById('calendar-modal-main').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeCalendarModalMain() {
      document.getElementById('calendar-modal-main').style.display = 'none';
      document.body.style.overflow = '';
    }

    document.getElementById('calendar-modal-main').addEventListener('click', (e) => {
      if (e.target.id === 'calendar-modal-main') {
        closeCalendarModalMain();
      }
    });

    // Close modal on Escape (matches healthcare.html)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeCalendarModalMain();
    });

    // Set up calendar modal triggers. Skipped outside 'home' mode: healthcare.html
    // and realestate.html's own injected script wires up [data-open-calendar]
    // itself against their own #calendar-modal — this delegated handler would
    // otherwise also fire and pop open this page's #calendar-modal-main on top of it.
    document.addEventListener('click', (e) => {
      if (window.__AIGENETIC_MODE__ !== 'home') return;
      if (e.target.matches('[data-open-calendar]')) {
        e.preventDefault();
        openCalendarModalMain();
      }
    });
  </script>
</body>
</html>
