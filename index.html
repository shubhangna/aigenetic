<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="AIgenetic - AI-powered phone assistants for Indian SMEs. Never miss a customer call. 24/7 appointment booking in 31+ Indian languages.">
  <meta name="keywords" content="AI phone assistant, voice agent India, appointment booking, SME automation, Indian languages">
  <meta name="author" content="AIgenetic (OPC) Pvt Ltd">
  
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="AIgenetic - Your AI Phone Assistant for 24×7 Customer Calls">
  <meta property="og:description" content="Never miss a customer call again. AIgenetic answers, understands, and books appointments automatically.">
  <meta property="og:url" content="https://aigenetic.in">
  
  <title>AIgenetic - Your AI Phone Assistant for 24×7 Customer Calls</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: #fff;
    }
    .mesh-gradient {
      background: radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.12), transparent 40%),
                  radial-gradient(circle at 80% 0%, rgba(59, 130, 246, 0.15), transparent 35%),
                  radial-gradient(circle at 50% 80%, rgba(99, 102, 241, 0.12), transparent 40%);
    }
    .text-gradient {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .glass-effect {
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 20px 60px rgba(59, 130, 246, 0.12);
      backdrop-filter: blur(12px);
    }
    .hover-lift {
      transition: transform 200ms ease, box-shadow 200ms ease;
    }
    .hover-lift:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
    }
    .animate-float {
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0); }
    }
    .animate-pulse-glow {
      animation: pulse-glow 3s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0% { box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3); }
      50% { box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3); }
      100% { box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3); }
    }
    @keyframes ping {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      75%, 100% {
        transform: scale(2);
        opacity: 0;
      }
    }
    .animate-ping {
      animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
  </style>
</head>
<body class="antialiased bg-white text-slate-800 custom-scrollbar">
  <div id="root"></div>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="config.js"></script>
  
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [form, setForm] = useState({ name: '', business: '', phone: '', city: '', time: '' });
      const phoneLink = `tel:${CONFIG.company.phoneDial}`;
      const whatsappLink = `https://wa.me/${CONFIG.company.whatsappNumber}`;
      const whatsappLinkWithText = `https://wa.me/${CONFIG.company.whatsappNumber}?text=${encodeURIComponent('Hi! I\'m interested in ' + CONFIG.company.name)}`;
      const featureIcons = ['⚡', '🌐', '⏰', '💰'];

      const handleChange = (e) => {
        setForm({ ...form, [e.target.name]: e.target.value });
      };

      const submitForm = (e) => {
        e.preventDefault();
        const subject = encodeURIComponent(`${CONFIG.company.name} - Request Demo`);
        const body = encodeURIComponent(
          `Name: ${form.name}\nBusiness: ${form.business}\nPhone: ${form.phone}\nCity: ${form.city}\nPreferred Demo Time: ${form.time}`
        );
        window.location.href = `mailto:${CONFIG.company.email}?subject=${subject}&body=${body}`;
      };

      return (
        <div className="min-h-screen bg-white">
          {/* Header */}
          <header id="header" className="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
            <div className="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
              <div className="flex items-center gap-4">
                <img src="logo/logoMedium.png" alt={CONFIG.company.name} className="h-16 w-auto" />
                <div className="hidden sm:block">
                  <div className="font-bold text-xl text-slate-900">{CONFIG.company.name}</div>
                  <div className="text-xs text-slate-600">{CONFIG.company.tagline}</div>
                </div>
              </div>

              <nav className="hidden md:flex items-center gap-6">
                <a href="#features" className="text-slate-600 hover:text-indigo-600 font-medium transition-colors">Features</a>
                <a href="#use-cases" className="text-slate-600 hover:text-indigo-600 font-medium transition-colors">Use Cases</a>
                <a href="#pricing" className="text-slate-600 hover:text-indigo-600 font-medium transition-colors">Pricing</a>
                <a href={phoneLink} className="px-5 py-2.5 rounded-lg border-2 border-slate-300 hover:border-indigo-600 hover:text-indigo-600 font-semibold transition-all">{CONFIG.hero.ctaPrimary}</a>
                <a href={whatsappLink} target="_blank" rel="noopener noreferrer" className="px-5 py-2.5 rounded-lg bg-gradient-to-r from-green-500 to-green-600 text-white font-semibold hover:shadow-lg transition-all">{CONFIG.hero.ctaSecondary}</a>
              </nav>

              <div className="md:hidden flex gap-2">
                <a href={phoneLink} className="px-3 py-2 rounded-lg border-2 border-slate-300 text-sm">📞</a>
                <a href={whatsappLink} target="_blank" rel="noopener noreferrer" className="px-3 py-2 rounded-lg bg-green-600 text-white text-sm">💬</a>
              </div>
            </div>
          </header>

          {/* Hero */}
          <section className="relative min-h-screen flex items-center justify-center mesh-gradient overflow-hidden pt-24">
            <div className="absolute inset-0 overflow-hidden pointer-events-none">
              <div className="absolute -top-40 -right-40 w-96 h-96 bg-violet-300 rounded-full mix-blend-multiply filter blur-2xl opacity-60 animate-float"></div>
              <div className="absolute -bottom-40 -left-40 w-96 h-96 bg-blue-300 rounded-full mix-blend-multiply filter blur-2xl opacity-60 animate-float" style={{ animationDelay: '2s' }}></div>
              <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-indigo-300 rounded-full mix-blend-multiply filter blur-2xl opacity-60 animate-float" style={{ animationDelay: '4s' }}></div>
            </div>

            <div className="relative max-w-7xl mx-auto px-6 py-24 grid lg:grid-cols-2 gap-16 items-center">
              <div className="space-y-8">
                <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full glass-effect text-blue-600 font-semibold text-sm">
                  <span className="relative flex h-3 w-3">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-500 opacity-75"></span>
                    <span className="relative inline-flex rounded-full h-3 w-3 bg-blue-600"></span>
                  </span>
                  {CONFIG.hero.badge}
                </div>

                <h1 className="text-5xl lg:text-6xl font-black leading-tight">
                  <span className="text-gradient">{CONFIG.hero.heading.split(' ').slice(0, 4).join(' ')}</span><br/>
                  <span className="text-slate-900">{CONFIG.hero.heading.split(' ').slice(4).join(' ') || CONFIG.company.name}</span>
                </h1>

                <p className="text-xl text-slate-600 leading-relaxed">
                  {CONFIG.hero.subheading}
                </p>

                <div className="flex flex-wrap gap-4">
                  <a href={phoneLink} className="group px-8 py-4 rounded-xl bg-gradient-to-r from-blue-600 via-indigo-600 to-violet-600 text-white font-bold text-lg shadow-xl hover:shadow-2xl transition-all hover:scale-105">
                    {CONFIG.hero.ctaPrimary}
                    <span className="ml-2 inline-block transition-transform group-hover:translate-x-1">→</span>
                  </a>
                  <a href={whatsappLink} target="_blank" rel="noopener noreferrer" className="px-8 py-4 rounded-xl border-2 border-green-600 text-green-600 font-bold text-lg hover:bg-green-50 transition-all">
                    {CONFIG.hero.ctaSecondary}
                  </a>
                </div>

                <div className="grid grid-cols-2 gap-4">
                  {CONFIG.hero.keyFeatures.map((feature, idx) => (
                    <div key={feature.title + idx} className="flex items-center gap-3 p-4 rounded-xl glass-effect hover-lift">
                      <span className="text-3xl">{featureIcons[idx] || '✓'}</span>
                      <div>
                        <div className="font-bold text-slate-900">{feature.title}</div>
                        <div className="text-sm text-slate-600">{feature.subtitle}</div>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="p-4 rounded-xl bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 inline-flex items-center gap-3">
                  <span className="text-2xl">🎉</span>
                  <div>
                    <div className="font-semibold text-amber-900">{CONFIG.hero.trust.title}</div>
                    <div className="text-amber-700">{CONFIG.hero.trust.subtitle}</div>
                  </div>
                </div>
              </div>

              <div className="relative">
                <div className="absolute inset-0 bg-gradient-to-r from-blue-500 via-indigo-500 to-violet-500 rounded-3xl blur-3xl opacity-20"></div>
                <div className="relative p-8 rounded-3xl glass-effect shadow-2xl">
                  <div className="space-y-4">
                    <div className="flex items-center justify-between p-4 rounded-xl bg-white shadow-md">
                      <div className="flex items-center gap-3">
                        <div className="w-12 h-12 rounded-full bg-gradient-to-br from-blue-500 to-indigo-500 flex items-center justify-center text-white font-bold text-xl">
                          👤
                        </div>
                        <div>
                          <div className="font-semibold text-slate-900">Incoming Call</div>
                          <div className="text-sm text-slate-500">{CONFIG.company.phoneDisplay}</div>
                        </div>
                      </div>
                      <div className="flex items-center gap-2 px-3 py-1 rounded-full bg-green-100 text-green-700 font-semibold text-sm">
                        <span className="relative flex h-2 w-2">
                          <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                          <span className="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                        </span>
                        AI Active
                      </div>
                    </div>

                    <div className="space-y-3">
                      <div className="p-4 rounded-xl bg-blue-50 border-l-4 border-blue-500 animate-float">
                        <div className="font-semibold text-blue-900 mb-1">Customer</div>
                        <div className="text-blue-800">"I need appointment for tomorrow 3 PM"</div>
                      </div>

                      <div className="p-4 rounded-xl bg-blue-50 border-l-4 border-blue-500 animate-float" style={{ animationDelay: '0.5s' }}>
                        <div className="font-semibold text-indigo-900 mb-1">{CONFIG.company.name} AI</div>
                        <div className="text-indigo-800">"Sure! 3 PM is available. Booking for you..."</div>
                      </div>

                      <div className="p-4 rounded-xl bg-green-50 border-l-4 border-green-500 animate-float" style={{ animationDelay: '1s' }}>
                        <div className="font-semibold text-green-900 mb-1">✓ Confirmed</div>
                        <div className="text-green-800">"Appointment booked! SMS sent."</div>
                      </div>
                    </div>

                    <div className="flex items-center justify-between p-4 rounded-xl bg-gradient-to-r from-green-500 to-emerald-500 text-white">
                      <div className="font-semibold">Call Duration: 1m 42s</div>
                      <div className="px-3 py-1 rounded-full bg-white/20 font-semibold">✓ Success</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Stats */}
          <section className="py-16 bg-slate-900 text-white" id="stats">
            <div className="max-w-7xl mx-auto px-6 grid md:grid-cols-4 gap-8">
              {CONFIG.stats.map((stat, idx) => (
                <div key={stat.label + idx} className={`text-center group hover-lift p-6 rounded-2xl bg-gradient-to-br ${stat.color} border`}>
                  <div className="text-4xl font-black mb-2">{stat.number}</div>
                  <div className="text-slate-600 font-medium">{stat.label}</div>
                </div>
              ))}
            </div>
          </section>

          {/* How It Works */}
          <section id="features" className="py-20 bg-gradient-to-b from-white to-slate-50">
            <div className="max-w-7xl mx-auto px-6">
              <div className="text-center max-w-3xl mx-auto mb-14">
                <h2 className="text-4xl font-black mb-4"><span className="text-gradient">How It Works</span></h2>
                <p className="text-lg text-slate-600">A simple, reliable flow that handles every customer call</p>
              </div>

              <div className="grid md:grid-cols-5 gap-6 mb-10">
                {CONFIG.howItWorks.map((item, idx) => (
                  <div key={item.title + idx} className="relative">
                    <div className={`bg-white rounded-2xl p-6 shadow-lg border border-slate-100 hover:shadow-xl transition-all h-full relative z-10`}>
                      <div className={`inline-flex items-center justify-center w-12 h-12 rounded-full bg-gradient-to-br ${item.color} text-white font-bold text-xl mb-4`}>
                        {item.step}
                      </div>
                      <div className="text-4xl mb-3">{item.icon}</div>
                      <div className="font-bold text-lg mb-2">{item.title}</div>
                      <div className="text-sm text-slate-600">{item.desc}</div>
                    </div>
                  </div>
                ))}
              </div>

              <div className="p-6 rounded-2xl bg-gradient-to-r from-blue-50 via-indigo-50 to-violet-50 border border-indigo-100 flex flex-col md:flex-row items-center gap-4">
                <div className="text-4xl">⚡</div>
                <div className="flex-1 text-center md:text-left">
                  <div className="font-bold text-lg">Average Call Duration: Under 2 Minutes</div>
                  <div className="text-slate-600 mt-1">Fast, efficient, and natural conversations</div>
                </div>
                <a href="#demo" className="px-6 py-3 rounded-lg bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold hover:from-blue-700 hover:to-indigo-700 shadow-md whitespace-nowrap">
                  See It In Action
                </a>
              </div>
            </div>
          </section>

          {/* Use Cases */}
          <section id="use-cases" className="py-20 bg-white">
            <div className="max-w-7xl mx-auto px-6">
              <div className="text-center max-w-3xl mx-auto mb-14">
                <h2 className="text-4xl font-black mb-4">Perfect for <span className="text-gradient">Any Business</span></h2>
                <p className="text-lg text-slate-600">Trusted by Indian SMEs across industries</p>
              </div>

              <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                {CONFIG.useCases.map((useCase, idx) => (
                  <div key={useCase.title + idx} className={`group relative overflow-hidden p-8 rounded-2xl text-white shadow-xl hover-lift bg-gradient-to-br ${useCase.gradient}`}>
                    <div className="relative z-10">
                      <div className="text-5xl mb-4 group-hover:scale-110 transition-transform">{useCase.icon}</div>
                      <h3 className="text-2xl font-bold mb-2">{useCase.title}</h3>
                      <p className="text-white/90 text-sm mb-4">{useCase.desc}</p>
                      <ul className="space-y-1 text-xs text-white/80">
                        {useCase.features.map((feature, jdx) => (
                          <li key={feature + jdx} className="flex items-start gap-2">
                            <span>✓</span>
                            <span>{feature}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                    <div className="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Why / USPs */}
          <section className="py-20 bg-gradient-to-b from-slate-50 to-white">
            <div className="max-w-7xl mx-auto px-6">
              <div className="text-center max-w-3xl mx-auto mb-14">
                <h2 className="text-4xl font-black mb-4">Why Choose {CONFIG.company.name}</h2>
                <p className="text-lg text-slate-600">Fully managed AI phone service designed for Indian businesses</p>
              </div>

              <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                {CONFIG.usps.map((usp, idx) => (
                  <div key={usp.title + idx} className="group p-6 rounded-2xl border border-slate-100 bg-white shadow-sm hover:shadow-xl transition-all hover:-translate-y-1">
                    <div className={`inline-flex items-center justify-center w-12 h-12 rounded-xl bg-gradient-to-br ${usp.gradient} text-white text-2xl mb-3 group-hover:scale-110 transition-transform`}>
                      {usp.icon}
                    </div>
                    <div className="font-bold text-lg mb-2">{usp.title}</div>
                    <div className="text-sm text-slate-600">{usp.desc}</div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Testimonials */}
          <section className="py-20 bg-white">
            <div className="max-w-7xl mx-auto px-6">
              <div className="text-center max-w-3xl mx-auto mb-14">
                <h2 className="text-4xl font-black mb-4">Trusted by 100+ Indian Businesses</h2>
                <p className="text-lg text-slate-600">See how {CONFIG.company.name} is transforming customer communication</p>
              </div>

              <div className="grid md:grid-cols-3 gap-6 mb-12">
                {CONFIG.testimonials.map((testimonial, idx) => (
                  <div key={testimonial.name + idx} className="p-6 rounded-2xl border border-slate-100 bg-white shadow-sm hover:shadow-lg transition-shadow">
                    <div className="flex gap-1 mb-3">
                      {[...Array(5)].map((_, jdx) => (
                        <span key={jdx} className="text-yellow-400 text-lg">★</span>
                      ))}
                    </div>
                    <p className="text-sm leading-relaxed mb-4 text-slate-700">"{testimonial.quote}"</p>
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 via-indigo-500 to-violet-500 flex items-center justify-center text-white font-bold">
                        {testimonial.name.charAt(0)}
                      </div>
                      <div>
                        <div className="font-semibold text-sm">{testimonial.name}</div>
                        <div className="text-xs text-slate-500">{testimonial.role}</div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Pricing */}
          <section id="pricing" className="py-20 bg-gradient-to-b from-slate-50 to-white">
            <div className="max-w-7xl mx-auto px-6">
              <div className="text-center max-w-3xl mx-auto mb-14">
                <h2 className="text-4xl font-black mb-4"><span className="text-gradient">Simple Pricing</span> That Scales</h2>
                <p className="text-lg text-slate-600">No hidden fees. Pay only for what you use.</p>
              </div>

              <div className="grid lg:grid-cols-3 gap-8 max-w-6xl mx-auto mb-10">
                {CONFIG.pricing.map((plan, idx) => (
                  <div key={plan.name + idx} className={`relative p-8 rounded-3xl ${plan.highlighted ? 'bg-gradient-to-br from-blue-600 via-indigo-600 to-violet-600 text-white shadow-2xl scale-105' : 'bg-white text-slate-900 shadow-lg border border-slate-200'} hover-lift`}>
                    {plan.badge && (
                      <div className={`absolute -top-4 left-1/2 -translate-x-1/2 px-4 py-1 rounded-full ${plan.highlighted ? 'bg-white text-slate-900' : 'bg-gradient-to-r from-yellow-400 to-orange-400 text-slate-900'} font-bold text-sm`}>
                        {plan.badge}
                      </div>
                    )}
                    <div className="text-sm font-bold uppercase tracking-wide mb-2 opacity-80">{plan.name}</div>
                    <div className="text-5xl font-black mb-1">{plan.price}<span className={`text-xl font-normal ${plan.highlighted ? 'text-white/80' : 'text-slate-500'}`}>{plan.period}</span></div>
                    <div className={`text-sm ${plan.highlighted ? 'text-white/80' : 'text-slate-500'} mb-8`}>{plan.usage}</div>
                    <ul className="space-y-4 mb-8">
                      {plan.features.map((feature, jdx) => (
                        <li key={feature + jdx} className="flex items-start gap-3">
                          <span className={plan.highlighted ? 'text-green-300' : 'text-green-500'}>✓</span>
                          <span className={plan.highlighted ? 'text-white/90' : 'text-slate-700'}>{feature}</span>
                        </li>
                      ))}
                    </ul>
                    <a
                      href={plan.name === 'Enterprise' ? whatsappLink : phoneLink}
                      target={plan.name === 'Enterprise' ? '_blank' : undefined}
                      rel={plan.name === 'Enterprise' ? 'noopener noreferrer' : undefined}
                      className={`block w-full text-center px-6 py-4 rounded-xl font-bold transition-all ${plan.highlighted ? 'bg-white text-blue-600 hover:bg-slate-100' : 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white hover:shadow-xl'}`}
                    >
                      {plan.cta}
                    </a>
                  </div>
                ))}
              </div>

              <div className="p-6 rounded-xl bg-amber-50 border border-amber-200 max-w-4xl mx-auto">
                <div className="flex items-start gap-3">
                  <span className="text-2xl">💡</span>
                  <div>
                    <div className="font-semibold text-amber-900 mb-1">{CONFIG.ctaMessages.pricingHelp.title}</div>
                    <div className="text-sm text-amber-800 mb-3">{CONFIG.ctaMessages.pricingHelp.description}</div>
                    <a href={whatsappLink} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-green-600 text-white text-sm font-semibold hover:bg-green-700">
                      💬 Chat on WhatsApp
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Demo Form */}
          <section id="demo" className="py-20 bg-white">
            <div className="max-w-7xl mx-auto px-6">
              <div className="text-center max-w-3xl mx-auto mb-12">
                <h2 className="text-4xl font-black mb-4">{CONFIG.ctaMessages.demoForm.heading}</h2>
                <p className="text-lg text-slate-600">{CONFIG.ctaMessages.demoForm.subheading}</p>
              </div>

              <div className="max-w-3xl mx-auto">
                <form onSubmit={submitForm} className="p-8 rounded-2xl bg-gradient-to-br from-blue-50 via-indigo-50 to-violet-50 border-2 border-indigo-100 shadow-xl">
                  <div className="grid md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-medium mb-2">Your Name *</label>
                      <input required name="name" value={form.name} onChange={handleChange} placeholder="Enter your name" className="w-full p-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium mb-2">Business Name *</label>
                      <input required name="business" value={form.business} onChange={handleChange} placeholder="Your business name" className="w-full p-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium mb-2">Phone Number *</label>
                      <input required name="phone" value={form.phone} onChange={handleChange} placeholder={CONFIG.company.phoneDisplay} className="w-full p-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium mb-2">City</label>
                      <input name="city" value={form.city} onChange={handleChange} placeholder={CONFIG.company.location} className="w-full p-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none" />
                    </div>
                    <div className="md:col-span-2">
                      <label className="block text-sm font-medium mb-2">Preferred Demo Time</label>
                      <input name="time" value={form.time} onChange={handleChange} placeholder="e.g., Tomorrow 3 PM" className="w-full p-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none" />
                    </div>
                  </div>

                  <div className="mt-6 flex flex-col sm:flex-row items-center gap-3">
                    <button type="submit" className="w-full sm:flex-1 px-6 py-3 rounded-lg bg-gradient-to-r from-blue-600 via-indigo-600 to-violet-600 text-white font-semibold hover:from-blue-700 hover:via-indigo-700 hover:to-violet-700 shadow-lg">
                      📧 Request Demo via Email
                    </button>
                    <span className="text-slate-500 text-sm">or</span>
                    <a href={phoneLink} className="w-full sm:w-auto px-6 py-3 rounded-lg border-2 border-blue-600 text-blue-600 font-semibold hover:bg-blue-50 whitespace-nowrap">
                      📞 Call Now
                    </a>
                    <a href={whatsappLink} target="_blank" rel="noopener noreferrer" className="w-full sm:w-auto px-6 py-3 rounded-lg bg-green-600 text-white font-semibold hover:bg-green-700 whitespace-nowrap">
                      💬 WhatsApp
                    </a>
                  </div>

                  <div className="mt-4 text-center text-sm text-slate-600">
                    {CONFIG.ctaMessages.demoForm.responseTime}
                  </div>
                </form>
              </div>
            </div>
          </section>

          {/* Footer */}
          <footer className="bg-slate-50 border-t border-slate-200">
            <div className="max-w-7xl mx-auto px-6 py-12">
              <div className="grid md:grid-cols-4 gap-8 mb-8">
                <div className="md:col-span-2">
                  <div className="flex items-center gap-4 mb-4">
                    <img src="logo/logo.png" alt={CONFIG.company.name} className="h-16 w-auto" />
                    <div>
                      <div className="font-bold text-lg">{CONFIG.company.name}</div>
                      <div className="text-sm text-slate-600">{CONFIG.company.tagline}</div>
                    </div>
                  </div>
                  <p className="text-sm text-slate-600 leading-relaxed mb-4">
                    {CONFIG.company.legalName} provides fully managed AI-powered phone assistants for Indian SMEs. We handle customer calls 24/7, book appointments, and help businesses never miss an opportunity.
                  </p>
                  <div className="flex gap-3">
                    <a href={phoneLink} className="px-4 py-2 rounded-lg bg-gradient-to-r from-blue-600 to-indigo-600 text-white text-sm font-semibold hover:from-blue-700 hover:to-indigo-700 shadow-md">📞 Call</a>
                    <a href={whatsappLink} target="_blank" rel="noopener noreferrer" className="px-4 py-2 rounded-lg bg-green-600 text-white text-sm font-semibold hover:bg-green-700">💬 WhatsApp</a>
                  </div>
                </div>

                <div>
                  <div className="font-semibold mb-4">Quick Links</div>
                  <ul className="space-y-2 text-sm text-slate-600">
                    <li><a href="#" className="hover:text-indigo-600">Home</a></li>
                    <li><a href="#features" className="hover:text-indigo-600">How It Works</a></li>
                    <li><a href="#pricing" className="hover:text-indigo-600">Pricing</a></li>
                    <li><a href="#demo" className="hover:text-indigo-600">Book Demo</a></li>
                  </ul>
                </div>

                <div>
                  <div className="font-semibold mb-4">Contact</div>
                  <ul className="space-y-2 text-sm text-slate-600">
                    <li className="flex items-start gap-2">
                      <span>📧</span>
                      <a href={`mailto:${CONFIG.company.email}`} className="hover:text-indigo-600">{CONFIG.company.email}</a>
                    </li>
                    <li className="flex items-start gap-2">
                      <span>📞</span>
                      <a href={phoneLink} className="hover:text-indigo-600">{CONFIG.company.phoneDisplay}</a>
                    </li>
                    <li className="flex items-start gap-2">
                      <span>💬</span>
                      <a href={whatsappLink} target="_blank" rel="noopener noreferrer" className="hover:text-indigo-600">WhatsApp Support</a>
                    </li>
                    <li className="flex items-start gap-2">
                      <span>🏢</span>
                      <span>{CONFIG.company.location}</span>
                    </li>
                  </ul>
                </div>
              </div>

              <div className="pt-8 border-t border-slate-200 flex flex-col md:flex-row items-center justify-between gap-4 text-sm text-slate-600">
                <div>© 2026 {CONFIG.company.legalName}. All rights reserved.</div>
                <div className="flex gap-6">
                  <a href="privacy-policy.html" className="hover:text-indigo-600">Privacy Policy</a>
                  <a href="terms-of-service.html" className="hover:text-indigo-600">Terms of Service</a>
                  <a href="refund-policy.html" className="hover:text-indigo-600">Refund Policy</a>
                </div>
              </div>

              <div className="mt-8 pt-8 border-t border-slate-200 flex flex-wrap items-center justify-center gap-6 text-xs text-slate-500">
                <div className="flex items-center gap-2">
                  <span>✓</span>
                  <span>TRAI Compliant</span>
                </div>
                <div className="flex items-center gap-2">
                  <span>🔒</span>
                  <span>SSL Secured</span>
                </div>
                <div className="flex items-center gap-2">
                  <span>🇮🇳</span>
                  <span>Made in India</span>
                </div>
                <div className="flex items-center gap-2">
                  <span>🏆</span>
                  <span>Soon to be ISO Certified</span>
                </div>
              </div>
            </div>
          </footer>

          {/* Floating Action Buttons */}
          <div className="fixed bottom-6 right-6 flex flex-col gap-3 z-50">
            <a href={whatsappLinkWithText} target="_blank" rel="noopener noreferrer" className="flex items-center justify-center w-14 h-14 rounded-full bg-green-600 text-white shadow-lg hover:bg-green-700 hover:scale-110 transition-all" title="WhatsApp us">
              <span className="text-2xl">💬</span>
            </a>
            <a href={phoneLink} className="flex items-center justify-center w-14 h-14 rounded-full bg-gradient-to-br from-blue-600 to-indigo-600 text-white shadow-lg hover:from-blue-700 hover:to-indigo-700 hover:scale-110 transition-all" title="Call us">
              <span className="text-2xl">📞</span>
            </a>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
