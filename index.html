  <!-- Vertical mode router: healthcare.html, realestate.html and education.html
       redirect here with ?mode= so the site lives under one URL. This fetches
       that page's markup — still the source of truth for its copy — into #mode-root. -->
  <script>
    function getAigeneticMode() {
      var params = new URLSearchParams(location.search);
      var mode = params.get('mode');
      return (mode === 'healthcare' || mode === 'realestate' || mode === 'education') ? mode : 'home';
    }
    window.__AIGENETIC_MODE__ = getAigeneticMode();

    async function loadModeContent(mode) {
      var file = mode === 'healthcare' ? 'healthcare.html' : (mode === 'education' ? 'education.html' : 'realestate.html');
      try {
        var res = await fetch(file);
        if (!res.ok) throw new Error('fetch failed: ' + res.status);
        var html = await res.text();
        var doc = new DOMParser().parseFromString(html, 'text/html');

        if (doc.title) document.title = doc.title;
        ['description', 'keywords', 'og:title', 'og:description', 'og:url',
         'twitter:title', 'twitter:description'].forEach(function (name) {
          var selector = name.indexOf(':') > -1
            ? 'meta[property="' + name + '"]'
            : 'meta[name="' + name + '"]';
          var src = doc.querySelector(selector);
          var dest = document.querySelector(selector);
          if (src && dest) dest.setAttribute('content', src.getAttribute('content'));
        });
        var canonical = document.querySelector('link[rel="canonical"]');
        if (canonical) canonical.href = 'https://aigenetic.in/?mode=' + mode;

        var styleTag = document.getElementById('mode-style');
        if (!styleTag) {
          styleTag = document.createElement('style');
          styleTag.id = 'mode-style';
          document.head.appendChild(styleTag);
        }
        styleTag.textContent = Array.from(doc.querySelectorAll('style'))
          .map(function (s) { return s.textContent; })
          .join('\n');

        var root = document.getElementById('root');
        if (root) root.style.display = 'none';
        var modeRoot = document.getElementById('mode-root');
        modeRoot.innerHTML = doc.body.innerHTML;
        modeRoot.style.display = '';

        modeRoot.querySelectorAll('script').forEach(function (oldScript) {
          var newScript = document.createElement('script');
          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.textContent = oldScript.textContent;
          }
          oldScript.replaceWith(newScript);
        });
      } catch (err) {
        console.error('Failed to load ' + mode + ' content inline, falling back to its own page.', err);
        location.href = file;
      }
    }
  </script>

        school: <><path d="m22 10-10-5L2 10l10 5 10-5z" /><path d="M6 12v5c1.8 1.3 3.8 2 6 2s4.2-.7 6-2v-5" /></>,
        bot: <><rect x="4" y="8" width="16" height="12" rx="3" /><path d="M12 8V4M9 13h.01M15 13h.01" /></>,

        wrench: <path d="M14.7 6.3a4.1 4.1 0 0 0-5.6 5.6L4 17l3 3 5.1-5.1a4.1 4.1 0 0 0 5.6-5.6L15 12l-3-3 2.7-2.7z" />,

    function plainLabel(value) {
      return String(value || "").replace(/^(?:[\uD800-\uDBFF][\uDC00-\uDFFF]|\uFE0F|\u200D|\s)+/, "").trim();

      "Affordable": "rupee"

    function Reveal({ as: Tag = "div", stagger = false, className = "", children, ...rest }) {
      const ref = useRef(null);
      const [inView, setInView] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const io = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              setInView(true);
              io.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12 });
        io.observe(el);
        return () => io.disconnect();
      }, []);
      const cls = `${stagger ? "stagger" : "reveal"} ${inView ? "in" : ""} ${className}`.trim();
      return <Tag ref={ref} className={cls} {...rest}>{children}</Tag>;
    }

    function HeroTitle({ text }) {
      if (text !== "The Voice of Your Business") return text;
      return <>The <em>Voice</em>{" "}<br />of Your Business</>;
    }

    function LiveVoiceCallButton({ className }) {
      const label = "Live Call to Voice Assistant";
      const [text, setText] = useState(label);
      const timeoutRef = useRef(null);
      const handleClick = () => {
        if (timeoutRef.current) return;
        setText("Call to voice assistant coming soon");
        timeoutRef.current = setTimeout(() => {
          setText(label);
          timeoutRef.current = null;
        }, 1000);
      };
      return (
        <button type="button" className={className} onClick={handleClick} aria-live="polite">
          <Icon name="mic" />
          {text}
        </button>
      );
    }

    function AudioShowcase() {
      const audioRefs = useRef([]);
      const [playingIndex, setPlayingIndex] = useState(null);
      const [timeData, setTimeData] = useState(CONFIG.audioDemos.map(() => ({ current: 0, duration: 0 })));
      const waveBase = [8, 16, 11, 22, 13, 18, 9, 20, 12, 24, 10, 17, 14, 21, 8, 16, 12, 19, 11, 22, 9, 15];

      const formatTime = (timeValue) => {
        if (!timeValue || Number.isNaN(timeValue)) return "0:00";
        const minutes = Math.floor(timeValue / 60);
        const seconds = Math.floor(timeValue % 60).toString().padStart(2, "0");
        return `${minutes}:${seconds}`;
      };

      const togglePlay = (index) => {
        const audio = audioRefs.current[index];
        if (!audio) return;
        if (playingIndex !== null && playingIndex !== index) {
          const activeAudio = audioRefs.current[playingIndex];
          if (activeAudio) activeAudio.pause();
        }
        if (audio.paused) {
          audio.play();
          setPlayingIndex(index);
        } else {
          audio.pause();
          setPlayingIndex(null);
        }
      };

      const updateTime = (index) => {
        const audio = audioRefs.current[index];
        if (!audio) return;
        setTimeData((prev) => {
          const next = [...prev];
          next[index] = { current: audio.currentTime, duration: audio.duration || 0 };
          return next;
        });
      };

      return (
        <div className="audio-grid">
          {CONFIG.audioDemos.map((demo, index) => (
            <article key={demo.title} className="audio-card">
              <div className="audio-card-top">
                <div>
                  <span className="audio-pill">{demo.category}</span>
                  <h3>{demo.title}</h3>
                  <p>{demo.desc}</p>
                </div>
                <button
                  type="button"
                  className="audio-play"
                  onClick={() => togglePlay(index)}
                  aria-label={playingIndex === index ? `Pause ${demo.title}` : `Play ${demo.title}`}
                >
                  <Icon name={playingIndex === index ? "pause" : "play"} />
                </button>
              </div>
              <div className={`audio-wave ${playingIndex === index ? "wave-active" : ""}`} aria-hidden="true">
                {waveBase.map((height, waveIndex) => (
                  <span
                    key={`${demo.title}-wave-${waveIndex}`}
                    style={{ height: `${height + ((index + waveIndex) % 4)}px`, animationDelay: `${waveIndex * 0.06}s` }}
                  />
                ))}
              </div>
              <div className="audio-time">
                <span>{formatTime(timeData[index].current)}</span>
                <span>{formatTime(timeData[index].duration)}</span>
              </div>
              <audio
                ref={(el) => { audioRefs.current[index] = el; }}
                src={encodeURI(demo.file)}
                preload="metadata"
                onTimeUpdate={() => updateTime(index)}
                onLoadedMetadata={() => updateTime(index)}
                onEnded={() => setPlayingIndex((prev) => (prev === index ? null : prev))}
              />
            </article>
          ))}
        </div>
      );
    }

                        <div>
                          <b>{testimonial.name}</b>
                          <span>{testimonial.role}</span>
                        </div>
                      </div>
                    </article>
                  ))}
                </Reveal>
              </div>
            </section>

            <section className="band" id="pricing">
              <div className="wrap">
                <div className="section-head">
                  <p className="section-label">Pricing</p>
                  <h2>Simple Pricing</h2>
                  <p className="lede">No hidden fees. Pay only for what you use.</p>
                </div>
                <Reveal as="div" stagger className="price-grid">
                  {CONFIG.pricing.map((plan) => (
                    <article key={plan.name} className={`minimal-card price-card${plan.highlighted ? " is-featured" : ""}`}>
                      {plan.badge && <span className="price-badge">{plan.badge}</span>}
                      <div className="price-name">{plan.name}</div>
                      <div className="price-amount">{plan.price}{plan.period && <span>{plan.period}</span>}</div>
                      <p className="price-usage">{plan.usage}</p>
                      <ul>
                        {plan.features.map((feature) => (
                          <li key={feature}><Icon name="check" /><span>{feature}</span></li>
                        ))}
                      </ul>
                      <a
                        className={`btn ${plan.highlighted ? "btn-primary" : "btn-ghost"}`}
                        href={plan.name === "Enterprise" ? whatsappLink : phoneLink}
                        target={plan.name === "Enterprise" ? "_blank" : undefined}
                        rel={plan.name === "Enterprise" ? "noopener noreferrer" : undefined}
                      >
                        {plan.cta}
                      </a>
                    </article>
                  ))}
                </Reveal>
                <div className="minimal-card help-card">
                  <span className="icon-well"><Icon name="bulb" /></span>
                  <div>
                    <h3>{CONFIG.ctaMessages.pricingHelp.title}</h3>
                    <p>{CONFIG.ctaMessages.pricingHelp.description}</p>
                    <a className="btn btn-primary" href={whatsappLink} target="_blank" rel="noopener noreferrer">
                      <Icon name="chat" /> Chat on WhatsApp
                    </a>
                  </div>
                </div>
              </div>
            </section>

            <section className="closing-wrap">
              <div className="wrap">
                <Reveal className="closing-panel">
                  <p className="section-label">Get Started</p>
                  <h2>Ready to stop missing calls?</h2>
                  <p className="lede">See Aigenetic answer, understand, and book appointments for your business — live, in a short demo.</p>
                  <div className="cta-row">
                    <a className="btn btn-primary btn-lg" href="#" data-open-calendar onClick={openDemo}>
                      <Icon name="calendar" /> Book a demo
                    </a>
                    <a className="btn btn-ghost btn-lg" href={whatsappLink} target="_blank" rel="noopener noreferrer">
                      <Icon name="chat" /> {plainLabel(CONFIG.hero.ctaSecondary)}
                    </a>
                    <a className="btn btn-ghost btn-lg" href={phoneLink} data-phone-link>
                      <Icon name="phone" /> {plainLabel(CONFIG.hero.ctaPrimary)}
                    </a>
                  </div>
                </Reveal>
              </div>
            </section>
          </main>

          <footer className="site-footer">
            <div className="wrap">
              <div className="footer-grid">
                <div className="footer-brand">
                  <a className="brand" href="#top">
                    <img src="logo/logoMedium.png" width="759" height="704" alt={CONFIG.company.name} />
                    {CONFIG.company.name} <small>for Businesses</small>
                  </a>
                  <p>
                    {CONFIG.company.legalName} provides fully managed AI-powered phone assistants for Indian SMEs — answers customer calls 24/7, books appointments, and helps businesses never miss an opportunity.
                  </p>
                </div>
                <div className="footer-col">
                  <h2>Quick Links</h2>
                  <a href="#top">Home</a>
                  <a href="#features">How It Works</a>
                  <a href="#use-cases">Use Cases</a>
                  <a href="#pricing">Pricing</a>
                  <a href="#" data-open-calendar onClick={openDemo}>Book a Demo</a>
                </div>
                <div className="footer-col">
                  <h2>Contact</h2>
                  <a href={`mailto:${CONFIG.company.email}`} data-email-link>{CONFIG.company.email}</a>
                  <a href={phoneLink} data-phone-link><span data-phone-display>{CONFIG.company.phoneDisplay}</span></a>
                  <a href={whatsappLink} target="_blank" rel="noopener noreferrer" data-whatsapp-link>WhatsApp Support</a>
                </div>
                <div className="footer-col">
                  <h2>Legal</h2>
                  <a href="privacy-policy.html">Privacy Policy</a>
                  <a href="terms-of-service.html">Terms of Service</a>
                  <a href="refund-policy.html">Refund Policy</a>
                </div>
              </div>
              <div className="footer-bottom">
                <span>© 2026 {CONFIG.company.legalName}. All rights reserved.</span>
                <span className="sp">Enterprise data stays in India, deleted on your schedule.</span>
              </div>
            </div>
          </footer>

          <div className={`fabs${showFab ? " show" : ""}`}>
            <a className="fab fab-wa" href={whatsappLinkWithText} target="_blank" rel="noopener noreferrer" aria-label="WhatsApp us">
              <Icon name="chat" />
            </a>
            <a className="fab" href={phoneLink} aria-label="Call us">
              <Icon name="phone" />
            </a>
          </div>
        </div>
      );
    }

    if (window.__AIGENETIC_MODE__ === "home") {
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    } else {
      loadModeContent(window.__AIGENETIC_MODE__);
    }
  </script>

  <div id="calendar-modal-main" role="dialog" aria-modal="true" aria-labelledby="calendar-modal-main-title" style="display:none;position:fixed;inset:0;background:rgba(14,27,30,.62);z-index:9999;align-items:center;justify-content:center;padding:20px">
    <div class="calendar-modal-main-content" style="background:#fff;border-radius:20px;padding:28px;max-width:680px;width:100%;max-height:calc(100dvh - 40px);overflow-y:auto;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);position:relative">
      <button type="button" class="modal-close" onclick="closeCalendarModalMain()" aria-label="Close booking dialog">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <h2 id="calendar-modal-main-title" style="font-family:Schibsted Grotesk, Helvetica Neue, Arial, sans-serif;font-size:28px;letter-spacing:-.03em;margin:0 0 8px;color:#0E1B1E">Schedule Your Demo</h2>
      <p style="color:#3C5254;margin:0 0 20px">Pick a time that works for you — Google Calendar takes care of the invite and the Meet link.</p>
      <iframe class="calendar-modal-main-iframe" src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2-oLNDtD7wJRTQhnQ4WwsQE_f0x_wePzs82A2ihrxI7WZJb-XRed0ak2ltUfH1zohb-16awYx4?gv=true" style="border:0;display:block;width:100%;height:600px;max-height:calc(100dvh - 180px)" title="Book a demo with Aigenetic"></iframe>
    </div>
  </div>

  <script>
    function openCalendarModalMain() {
      var modal = document.getElementById("calendar-modal-main");
      modal.style.display = "flex";
      document.body.style.overflow = "hidden";
      var closeBtn = modal.querySelector("button");
      if (closeBtn) closeBtn.focus();
    }

    function closeCalendarModalMain() {
      document.getElementById("calendar-modal-main").style.display = "none";
      document.body.style.overflow = "";
    }

    document.getElementById("calendar-modal-main").addEventListener("click", (e) => {
      if (e.target.id === "calendar-modal-main") closeCalendarModalMain();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeCalendarModalMain();
    });

    document.addEventListener("click", (e) => {
      if (window.__AIGENETIC_MODE__ !== "home") return;
      var trigger = e.target.closest && e.target.closest("[data-open-calendar]");
      if (trigger) {
        e.preventDefault();
        openCalendarModalMain();
      }
    });
  </script>
</body>
</html>
