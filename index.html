  <!-- Tailwind CSS -->

    window.tailwind = window.tailwind || {};

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #0E1B1E;
      --secondary: #FAFAF7;
      --accent: #0C6B5C;
      --accent-deep: #084A40;
      --mint: #E9F3F0;
      --text-primary: #0E1B1E;
      --text-secondary: #546567;
      --border: #E3E5E0;

      /* derived surface + motion tokens — mirrors healthcare.html's
         theme.clinicalTeal additions; no new brand hues introduced.
         See newSite/template.json theme.default for the source of truth. */
      --card: #FFFFFF;
      --line-soft: #EDEEEA;
      --mint-deep: #DCEDE7;
      --r-sm: 12px;
      --r-md: 18px;
      --r-lg: 26px;
      --sh-1: 0 1px 2px rgba(14,27,30,.05), 0 8px 24px -18px rgba(14,27,30,.35);
      --sh-2: 0 2px 6px rgba(14,27,30,.05), 0 26px 60px -38px rgba(14,27,30,.45);
      --sh-3: 0 30px 80px -46px rgba(12,107,92,.55);
      --ease: cubic-bezier(.2,.7,.3,1);
    }

    body {
      background: var(--secondary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      color: var(--text-primary);
      overflow-x: hidden;
    }

    /* ambient wash — sits behind everything, costs nothing (same pattern as healthcare.html) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(760px 520px at 78% -6%, rgba(23,179,127,.10), transparent 62%),
        radial-gradient(620px 460px at 6% 2%, rgba(12,107,92,.08), transparent 60%);
    }
    #root { position: relative; z-index: 1; }

    .text-gradient {
      background: linear-gradient(135deg, #0E1B1E, #0C6B5C);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .accent-gradient {
      background: linear-gradient(135deg, #0C6B5C, #084A40);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .hover-rise {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .hover-rise:hover {
      transform: translateY(-8px);
    }
    
    .line-accent {
      position: relative;
      display: inline-block;
    }
    
    .line-accent::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      width: 80px;
      height: 2px;
      background: var(--primary);
    }
    
    .minimal-card {
      background: white;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }
    
    .minimal-card:hover {
      border-color: var(--text-primary);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .fade-in-up {
      animation: fadeInUp 0.8s ease-out;
    }
    
    .section-divide {
      position: relative;
    }
    
    .section-divide::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 1px;
      background: var(--border);
    }

    .section-label {
      text-align: center;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .hero-title {
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 600;
      letter-spacing: -3px;
      line-height: 1.1;
    }

    .feature-icon-box {
      width: 56px;
      height: 56px;
      background: var(--primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
    }

    /* ---------- nav: sticky scroll state + mobile menu ----------
       Mirrors healthcare.html's .nav.scrolled behavior and hamburger
       pattern (nav.$mobilePattern in newSite/template.json), reimplemented
       as React state here since index.html is JSX, not vanilla JS. */
    #header { transition: box-shadow .3s var(--ease), background .3s var(--ease), border-color .3s var(--ease); }
    #header.scrolled { background: rgba(250,250,247,.92) !important; box-shadow: 0 10px 30px -28px rgba(14,27,30,.7); border-bottom-color: var(--border) !important; }
    .nav-toggle { display: none; width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--border); background: #fff; cursor: pointer; padding: 0; align-items: center; justify-content: center; flex-direction: column; gap: 4px; }
    .nav-toggle i { display: block; width: 16px; height: 2px; background: var(--primary); border-radius: 2px; transition: transform .25s var(--ease), opacity .2s var(--ease); }
    .nav-toggle.open i:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .nav-toggle.open i:nth-child(2) { opacity: 0; }
    .nav-toggle.open i:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
    .nav-panel { border-top: 1px solid var(--border); background: rgba(250,250,247,.98); padding: 10px 0 18px; }
    .nav-panel a { display: block; padding: 12px 4px; text-decoration: none; color: var(--primary); font-weight: 500; border-bottom: 1px solid var(--line-soft); }
    .nav-panel a:last-child { border-bottom: 0; }
    .nav-panel .panel-cta { display: flex; gap: 10px; margin-top: 16px; }
    @media (max-width: 767px) { .nav-toggle { display: flex; } }

    /* ---------- hero: masked grid wash (mirrors healthcare.html .hero::after) ---------- */
    .hero-grid-wash::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background-image:
        linear-gradient(rgba(14,27,30,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(14,27,30,.04) 1px, transparent 1px);
      background-size: 64px 64px;
      -webkit-mask-image: radial-gradient(720px 420px at 50% 8%, #000 0%, transparent 78%);
              mask-image: radial-gradient(720px 420px at 50% 8%, #000 0%, transparent 78%);
    }

    /* ---------- hero key-feature rail as hover-lift cards (mirrors healthcare.html .rail) ---------- */
    .stat-card {
      position: relative;
      padding: 20px 18px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      box-shadow: var(--sh-1);
      overflow: hidden;
      transition: transform .3s var(--ease), border-color .3s var(--ease), box-shadow .3s var(--ease);
    }
    .stat-card::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--accent);
      transform: scaleY(0);
      transform-origin: top;
      transition: transform .35s var(--ease);
    }
    .stat-card:hover { transform: translateY(-4px); border-color: var(--mint-deep); box-shadow: var(--sh-2); }
    .stat-card:hover::before { transform: scaleY(1); }

    /* ---------- use-case card index badge (mirrors healthcare.html .cell .idx) ---------- */
    .card-idx {
      font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
      font-size: 11.5px;
      letter-spacing: .14em;
      color: var(--accent);
      opacity: .75;
      display: block;
      margin-bottom: 10px;
    }

    /* ---------- closing CTA: dark rounded panel (mirrors healthcare.html .close-in) ---------- */
    .closing-panel {
      background: var(--primary);
      color: #EAF2F0;
      border-radius: 34px;
      padding: 88px 32px 76px;
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    .closing-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(620px 320px at 50% 0%, rgba(23,179,127,.22), transparent 66%),
        radial-gradient(420px 260px at 12% 100%, rgba(12,107,92,.3), transparent 70%);
    }
    .closing-panel > * { position: relative; }
    @media (max-width: 900px) { .closing-panel { padding: 64px 22px 56px; border-radius: 26px; } }

    /* ---------- scroll-reveal motion (mirrors healthcare.html .reveal / .stagger) ---------- */
    .reveal { opacity: 0; transform: translateY(20px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
    .reveal.in { opacity: 1; transform: none; }
    .stagger > * { opacity: 0; transform: translateY(18px); transition: opacity .6s var(--ease), transform .6s var(--ease); }
    .stagger.in > * { opacity: 1; transform: none; }
    .stagger.in > *:nth-child(1) { transition-delay: .04s; }
    .stagger.in > *:nth-child(2) { transition-delay: .10s; }
    .stagger.in > *:nth-child(3) { transition-delay: .16s; }
    .stagger.in > *:nth-child(4) { transition-delay: .22s; }
    .stagger.in > *:nth-child(5) { transition-delay: .28s; }
    .stagger.in > *:nth-child(6) { transition-delay: .34s; }
    @media (prefers-reduced-motion: reduce) {
      .reveal, .stagger > * { transition: none !important; opacity: 1 !important; transform: none !important; }
      .stat-card:hover, .hover-rise:hover { transform: none !important; }
    }

    /* ---------- calendar modal polish ---------- */
    #calendar-modal-main { backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    .calendar-modal-main-content { animation: modal-in .35s var(--ease); }
    @keyframes modal-in { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body class="antialiased text-slate-900 custom-scrollbar">
    
  <div id="root"></div>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="config.js"></script>
  
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Scroll-reveal wrapper — mirrors healthcare.html's IntersectionObserver-driven
    // .reveal / .stagger classes, reimplemented as a React component since index.html
    // is JSX. `stagger` reveals direct children one-by-one via the .stagger CSS rules.
    function Reveal({ as: Tag = 'div', stagger = false, className = '', children, ...rest }) {
      const ref = useRef(null);
      const [inView, setInView] = useState(false);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const io = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              setInView(true);
              io.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12 });
        io.observe(el);
        return () => io.disconnect();
      }, []);

      const cls = `${stagger ? 'stagger' : 'reveal'} ${inView ? 'in' : ''} ${className}`.trim();
      return <Tag ref={ref} className={cls} {...rest}>{children}</Tag>;
    }

    function App() {
      const phoneLink = `tel:${CONFIG.company.phoneDial}`;
      const whatsappLink = `https://wa.me/${CONFIG.company.whatsappNumber}`;
      const whatsappLinkWithText = `https://wa.me/${CONFIG.company.whatsappNumber}?text=${encodeURIComponent('Hi! I\'m interested in ' + CONFIG.company.name)}`;
      const featureIcons = ['⚡', '🌐', '⏰', '💰'];
      const [scrolled, setScrolled] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);

      // Sticky nav shadow/background once the page scrolls — mirrors
      // healthcare.html's .nav.scrolled behavior.
      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 8);
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      return (
        <div className="min-h-screen" style={{background: 'var(--secondary)'}}>
          {/* Header */}
          <header id="header" className={`sticky top-0 z-40${scrolled ? ' scrolled' : ''}`} style={{background: 'rgba(250, 250, 247, 0.86)', backdropFilter: 'blur(10px)', WebkitBackdropFilter: 'blur(10px)', borderBottom: '1px solid var(--border)'}}>
            <div className="max-w-7xl mx-auto px-8 flex items-center" style={{height: '68px', gap: '28px'}}>
              <div className="flex items-center" style={{gap: '10px'}}>
                <img src="logo/logoMedium.png" alt={CONFIG.company.name} style={{height: '32px', width: 'auto'}} />
                <div style={{fontFamily: "'Schibsted Grotesk','Helvetica Neue',Arial,sans-serif", fontWeight: 800, fontSize: '19px', letterSpacing: '-0.02em', color: 'var(--primary)'}}>{CONFIG.company.name} <span style={{fontWeight: 500, fontSize: '13px', color: 'var(--text-secondary)'}}>for Businesses</span></div>
              </div>

              <nav className="hidden md:flex items-center" style={{gap: '30px', fontSize: '15px', fontWeight: 500}}>
                <a href="#features" className="transition-colors" style={{color: 'var(--text-secondary)', textDecoration: 'none'}} onMouseEnter={(e) => e.target.style.color = 'var(--text-primary)'} onMouseLeave={(e) => e.target.style.color = 'var(--text-secondary)'}>Features</a>
                <a href="#use-cases" className="transition-colors" style={{color: 'var(--text-secondary)', textDecoration: 'none'}} onMouseEnter={(e) => e.target.style.color = 'var(--text-primary)'} onMouseLeave={(e) => e.target.style.color = 'var(--text-secondary)'}>Use Cases</a>
                <a href="#pricing" className="transition-colors" style={{color: 'var(--text-secondary)', textDecoration: 'none'}} onMouseEnter={(e) => e.target.style.color = 'var(--text-primary)'} onMouseLeave={(e) => e.target.style.color = 'var(--text-secondary)'}>Pricing</a>
              </nav>

              <div className="hidden md:flex items-center" style={{marginLeft: 'auto', gap: '12px'}}>
                <a href={phoneLink} className="transition-all" style={{display: 'inline-flex', alignItems: 'center', fontWeight: 600, fontSize: '15px', padding: '12px 18px', borderRadius: '999px', background: 'white', border: '1px solid var(--border)', color: 'var(--primary)', textDecoration: 'none'}} onMouseEnter={(e) => {e.target.style.borderColor = 'var(--primary)'}} onMouseLeave={(e) => {e.target.style.borderColor = 'var(--border)'}}>📞 Call</a>
                <a href="#" onClick={(e) => {e.preventDefault(); openCalendarModalMain();}} className="transition-all" style={{display: 'inline-flex', alignItems: 'center', fontWeight: 600, fontSize: '15px', padding: '12px 18px', borderRadius: '999px', background: 'var(--primary)', color: 'white', textDecoration: 'none'}} onMouseEnter={(e) => {e.target.style.background = '#084A40'; e.target.style.transform = 'translateY(-2px)'}} onMouseLeave={(e) => {e.target.style.background = 'var(--primary)'; e.target.style.transform = 'translateY(0)'}}>📅 Book Demo</a>
              </div>

              <button
                type="button"
                className={`nav-toggle md:hidden${menuOpen ? ' open' : ''}`}
                style={{marginLeft: 'auto'}}
                aria-expanded={menuOpen}
                aria-controls="mobile-nav-panel"
                aria-label={menuOpen ? 'Close menu' : 'Open menu'}
                onClick={() => setMenuOpen((open) => !open)}
              >
                <i></i><i></i><i></i>
              </button>
            </div>

            {menuOpen && (
              <div className="nav-panel md:hidden" id="mobile-nav-panel">
                <div className="max-w-7xl mx-auto px-8">
                  <a href="#features" onClick={() => setMenuOpen(false)}>Features</a>
                  <a href="#use-cases" onClick={() => setMenuOpen(false)}>Use Cases</a>
                  <a href="#pricing" onClick={() => setMenuOpen(false)}>Pricing</a>
                  <div className="panel-cta">
                    <a href={phoneLink} className="transition-all" style={{flex: 1, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontWeight: 600, fontSize: '15px', padding: '13px 14px', borderRadius: '999px', background: 'white', border: '1px solid var(--border)', color: 'var(--primary)', textDecoration: 'none'}}>📞 Call</a>
                    <a href="#" onClick={(e) => {e.preventDefault(); setMenuOpen(false); openCalendarModalMain();}} className="transition-all" style={{flex: 1, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontWeight: 600, fontSize: '15px', padding: '13px 14px', borderRadius: '999px', background: 'var(--primary)', color: 'white', textDecoration: 'none'}}>📅 Book Demo</a>
                  </div>
                </div>
              </div>
            )}
          </header>

          {/* Hero */}
          <section className="relative min-h-screen flex items-center justify-center hero-grid-wash" style={{background: 'var(--secondary)'}}>
            <div className="relative max-w-7xl mx-auto px-8 py-32 text-center">
              <div className="max-w-5xl mx-auto space-y-10 fade-in-up">
                <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium" style={{background: 'white', border: '1px solid var(--border)', color: 'var(--text-secondary)'}}>
                  <span className="relative flex h-2 w-2">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span className="relative inline-flex rounded-full h-2 w-2" style={{background: 'var(--accent)'}}></span>
                  </span>
                  {CONFIG.hero.badge}
                </div>

                <h1 className="hero-title" style={{color: 'var(--primary)'}}>
                  {CONFIG.hero.heading}
                </h1>

                <p className="text-xl leading-relaxed max-w-3xl mx-auto" style={{color: 'var(--text-secondary)'}}>
                  {CONFIG.hero.subheading}
                </p>

                <div className="flex flex-wrap justify-center gap-4 pt-6">
                  <a href={phoneLink} className="group px-10 py-4 rounded-lg font-medium text-lg transition-all inline-flex items-center gap-2" style={{background: 'var(--primary)', color: 'white'}} onMouseEnter={(e) => {e.currentTarget.style.background = '#084A40'; e.currentTarget.style.transform = 'translateY(-2px)'}} onMouseLeave={(e) => {e.currentTarget.style.background = 'var(--primary)'; e.currentTarget.style.transform = 'translateY(0)'}}>
                    {CONFIG.hero.ctaPrimary}
                    <span className="transition-transform">→</span>
                  </a>
                  <a href={whatsappLink} target="_blank" rel="noopener noreferrer" className="px-10 py-4 rounded-lg font-medium text-lg transition-all" style={{background: 'transparent', color: 'var(--text-primary)', border: '1px solid var(--border)'}} onMouseEnter={(e) => {e.currentTarget.style.borderColor = 'var(--text-primary)'; e.currentTarget.style.transform = 'translateY(-2px)'}} onMouseLeave={(e) => {e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.transform = 'translateY(0)'}}>
                    {CONFIG.hero.ctaSecondary}
                  </a>
                  <a href="#" onClick={(e) => {e.preventDefault(); openCalendarModalMain();}} className="px-10 py-4 rounded-lg font-medium text-lg transition-all" style={{background: 'transparent', color: 'var(--text-primary)', border: '1px solid var(--border)'}} onMouseEnter={(e) => {e.currentTarget.style.borderColor = 'var(--accent)'; e.currentTarget.style.transform = 'translateY(-2px)'}} onMouseLeave={(e) => {e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.transform = 'translateY(0)'}}>
                    📅 Schedule Demo
                  </a>
                  <LiveVoiceCallButton
                    label="🎙️ Live Call to Voice Assistant"
                    className="px-10 py-4 rounded-lg font-medium text-lg transition-all"
                    style={{background: 'transparent', color: 'var(--text-primary)', border: '1px solid var(--border)', cursor: 'pointer'}}
                    onMouseEnter={(e) => {e.currentTarget.style.borderColor = 'var(--accent)'; e.currentTarget.style.transform = 'translateY(-2px)'}}
                    onMouseLeave={(e) => {e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.transform = 'translateY(0)'}}
                  />
                </div>

                <Reveal as="div" stagger className="pt-16 grid grid-cols-2 md:grid-cols-4 gap-4 max-w-4xl mx-auto text-left">
                  {CONFIG.hero.keyFeatures.map((feature, idx) => (
                    <div key={feature.title + idx} className="stat-card">
                      <div className="text-3xl mb-3">{featureIcons[idx] || '✓'}</div>
                      <div className="font-semibold text-sm mb-1" style={{color: 'var(--text-primary)'}}>{feature.title}</div>
                      <div className="text-xs" style={{color: 'var(--text-secondary)'}}>{feature.subtitle}</div>
                    </div>
                  ))}
                </Reveal>
              </div>
            </div>
          </section>

          {/* Stats */}
          <section className="py-24" style={{background: 'white'}}>
            <div className="max-w-7xl mx-auto px-8">
              <Reveal as="div" stagger className="grid md:grid-cols-4 gap-12">
                {CONFIG.stats.map((stat, idx) => (

    function LiveVoiceCallButton({ label, className, style, onMouseEnter, onMouseLeave }) {
      const [text, setText] = useState(label);
      const timeoutRef = React.useRef(null);

      const handleClick = () => {
        if (timeoutRef.current) return;
        setText('Call to voice assistant coming soon');
        timeoutRef.current = setTimeout(() => {
          setText(label);
          timeoutRef.current = null;
        }, 1000);
      };

      return (
        <button type="button" onClick={handleClick} className={className} style={style} onMouseEnter={onMouseEnter} onMouseLeave={onMouseLeave}>
          {text}
        </button>
      );
    }

    function AudioShowcase() {
      const audioRefs = React.useRef([]);
      const [playingIndex, setPlayingIndex] = React.useState(null);
      const [timeData, setTimeData] = React.useState(
        CONFIG.audioDemos.map(() => ({ current: 0, duration: 0 }))
      );
      const waveBase = [6, 14, 10, 18, 12, 20, 8, 16, 11, 22, 9, 17, 13, 19, 7, 15, 10, 18, 12, 20, 9, 16];

      const formatTime = (timeValue) => {
        if (!timeValue || Number.isNaN(timeValue)) return '0:00';
        const minutes = Math.floor(timeValue / 60);
        const seconds = Math.floor(timeValue % 60).toString().padStart(2, '0');
        return `${minutes}:${seconds}`;
      };

      const getWaveHeights = (index) =>
        waveBase.map((height, i) => height + ((index + i) % 4));

      const togglePlay = (index) => {
        const audio = audioRefs.current[index];
        if (!audio) return;
        if (playingIndex !== null && playingIndex !== index) {
          const activeAudio = audioRefs.current[playingIndex];
          if (activeAudio) activeAudio.pause();
        }
        if (audio.paused) {
          audio.play();
          setPlayingIndex(index);
        } else {
          audio.pause();
          setPlayingIndex(null);
        }
      };

      const updateTime = (index) => {
        const audio = audioRefs.current[index];
        if (!audio) return;
        setTimeData((prev) => {
          const next = [...prev];
          next[index] = { current: audio.currentTime, duration: audio.duration || 0 };
          return next;
        });
      };

      const handleEnded = (index) => {
        setPlayingIndex((prev) => (prev === index ? null : prev));
      };

      return (
        <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-8">
          {CONFIG.audioDemos.map((demo, index) => (
            <div key={demo.title + index} className="audio-card p-8 rounded-2xl flex flex-col gap-6">
              <div className="flex items-start justify-between gap-4">
                <div>
                  <div className="audio-pill text-xs font-semibold uppercase tracking-widest px-3 py-1 rounded-full inline-flex">
                    {demo.category}
                  </div>
                  <h3 className="text-xl font-semibold mt-4" style={{color: 'var(--text-primary)'}}>{demo.title}</h3>
                  <p className="text-sm mt-2" style={{color: 'var(--text-secondary)'}}>{demo.desc}</p>
                </div>
                <button
                  type="button"
                  className="audio-play w-12 h-12 rounded-full flex items-center justify-center text-white text-xs font-semibold"
                  onClick={() => togglePlay(index)}
                  aria-label={playingIndex === index ? `Pause ${demo.title}` : `Play ${demo.title}`}
                >
                  {playingIndex === index ? 'Pause' : 'Play'}
                </button>
              </div>

              <div className={`audio-wave ${playingIndex === index ? 'wave-active' : ''}`}>
                {getWaveHeights(index).map((height, waveIndex) => (
                  <span
                    key={`${demo.title}-wave-${waveIndex}`}
                    style={{
                      height: `${height}px`,
                      animationDelay: `${waveIndex * 0.08}s`
                    }}
                  />
                ))}
              </div>

              <div className="flex items-center justify-between text-xs audio-time">
                <span>{formatTime(timeData[index].current)}</span>
                <span>{formatTime(timeData[index].duration)}</span>
              </div>

              <audio
                ref={(el) => { audioRefs.current[index] = el; }}
                src={encodeURI(demo.file)}
                preload="metadata"
                onTimeUpdate={() => updateTime(index)}
                onLoadedMetadata={() => updateTime(index)}
                onEnded={() => handleEnded(index)}
              />
            </div>
          ))}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <!-- Calendar Booking Modal for Main Site -->
  <div id="calendar-modal-main" role="dialog" aria-modal="true" aria-labelledby="calendar-modal-main-title" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,10,10,0.6);z-index:9999;align-items:center;justify-content:center;padding:20px">
    <div class="calendar-modal-main-content" style="background:#fff;border-radius:20px;padding:32px;max-width:680px;width:100%;max-height:calc(100dvh - 40px);overflow-y:auto;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);position:relative">
      <button onclick="closeCalendarModalMain()" aria-label="Close booking dialog" style="position:absolute;top:16px;right:16px;width:32px;height:32px;border:none;background:transparent;cursor:pointer;font-size:24px;color:#666">✕</button>
      <h2 id="calendar-modal-main-title" style="font-size:28px;margin-bottom:8px;color:var(--primary)">Schedule Your Demo</h2>
      <p style="color:var(--text-secondary);margin-bottom:24px">Pick a time that works for you — Google Calendar takes care of the invite and the Meet link.</p>

      <!-- Google Calendar Appointment Scheduling begin -->
      <iframe class="calendar-modal-main-iframe" src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2-oLNDtD7wJRTQhnQ4WwsQE_f0x_wePzs82A2ihrxI7WZJb-XRed0ak2ltUfH1zohb-16awYx4?gv=true" style="border: 0;display:block;width:100%;height:600px;max-height:calc(100dvh - 180px)" frameborder="0" title="Book a demo with Aigenetic"></iframe>
      <!-- end Google Calendar Appointment Scheduling -->
    </div>
  </div>

  <script>
    // Calendar Modal Functions for Main Site
    function openCalendarModalMain() {
      document.getElementById('calendar-modal-main').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeCalendarModalMain() {
      document.getElementById('calendar-modal-main').style.display = 'none';
      document.body.style.overflow = '';
    }

    document.getElementById('calendar-modal-main').addEventListener('click', (e) => {
      if (e.target.id === 'calendar-modal-main') {
        closeCalendarModalMain();
      }
    });

    // Close modal on Escape (matches healthcare.html)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeCalendarModalMain();
    });

    // Set up calendar modal triggers
    document.addEventListener('click', (e) => {
      if (e.target.matches('[data-open-calendar]')) {
        e.preventDefault();
        openCalendarModalMain();
      }
    });
  </script>
</body>
</html>
