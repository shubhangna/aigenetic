<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Essential Meta Tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="AIgenetic - AI-powered phone assistants for Indian SMEs. Never miss a customer call. 24/7 appointment booking in 31+ Indian languages.">
  <meta name="keywords" content="AI phone assistant, voice agent India, appointment booking, SME automation, Indian languages, AI receptionist, virtual phone assistant, business automation India">
  <meta name="author" content="AIgenetic (OPC) Pvt Ltd">
  <meta name="robots" content="index, follow">
  <meta name="language" content="English">
  <meta name="revisit-after" content="7 days">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="AIgenetic - Your AI Phone Assistant for 24×7 Customer Calls">
  <meta property="og:description" content="Never miss a customer call again. AIgenetic answers, understands, and books appointments automatically for your business.">
  <meta property="og:url" content="https://aigenetic.in">
  <meta property="og:site_name" content="AIgenetic">
  <meta property="og:locale" content="en_IN">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AIgenetic - Your AI Phone Assistant">
  <meta name="twitter:description" content="24/7 AI-powered phone assistant for Indian businesses. Never miss a customer call.">
  
  <!-- Canonical URL -->
  <link rel="canonical" href="https://aigenetic.in">
  
  <!-- Favicon (placeholder - replace with actual favicon) -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  
  <title>AIgenetic - Your AI Phone Assistant for 24×7 Customer Calls | Indian SMEs</title>
  
  <!-- Preconnect to external domains for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
  
  <!-- Google Fonts - Preload for performance -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* CSS Variables for easy theming */
    :root {
      --color-primary: #4f46e5;
      --color-primary-dark: #4338ca;
      --color-success: #10b981;
      --color-warning: #f59e0b;
    }
    
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      scroll-behavior: smooth;
    }
    
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .animate-pulse-slow {
      animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }
    
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 5px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    
    /* Performance: Reduce animations on low-end devices */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
  
  <!-- JSON-LD Structured Data for SEO -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "AIgenetic",
    "legalName": "AIgenetic (OPC) Pvt Ltd",
    "url": "https://aigenetic.in",
    "logo": "https://aigenetic.in/logo.png",
    "description": "AI-powered phone assistants for Indian SMEs. Never miss a customer call. 24/7 appointment booking in 31+ Indian languages.",
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "IN",
      "addressLocality": "Mumbai"
    },
    "contactPoint": {
      "@type": "ContactPoint",
      "telephone": "+91-90000-00000",
      "contactType": "Customer Service",
      "availableLanguage": ["en", "hi", "mr"]
    },
    "sameAs": []
  }
  </script>
</head>
<body class="antialiased bg-white text-slate-800">
  <!-- No-JS Fallback -->
  <noscript>
    <div style="padding: 20px; background: #fef3c7; border: 2px solid #f59e0b; margin: 20px; border-radius: 8px; text-align: center;">
      <h2 style="color: #92400e;">JavaScript Required</h2>
      <p style="color: #78350f;">This website requires JavaScript to be enabled. Please enable JavaScript in your browser settings to continue.</p>
    </div>
  </noscript>
  
  <div id="root"></div>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="config.js"></script>
  
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script type="text/babel">
    const { useState } = React;
    
    function AIgeneticLanding() {
      const [form, setForm] = useState({ name: '', business: '', phone: '', city: '', time: '' });
      const phoneLink = `tel:${CONFIG.company.phoneDial}`;
      const whatsappLink = `https://wa.me/${CONFIG.company.whatsappNumber}`;
      const whatsappLinkWithText = `https://wa.me/${CONFIG.company.whatsappNumber}?text=Hi!%20I'm%20interested%20in%20${CONFIG.company.name}`;
      
      function handleChange(e) {
        setForm({ ...form, [e.target.name]: e.target.value });
      }
      
      function submitForm(e) {
        e.preventDefault();
        const subject = encodeURIComponent(`${CONFIG.company.name} - Request Demo`);
        const body = encodeURIComponent(
          `Name: ${form.name}\\nBusiness: ${form.business}\\nPhone: ${form.phone}\\nCity: ${form.city}\\nPreferred Demo Time: ${form.time}`
        );
        window.location.href = `mailto:${CONFIG.company.email}?subject=${subject}&body=${body}`;
      }
      
      return (
        <div className="min-h-screen bg-white">
          {/* Header */}
          <header className="sticky top-0 z-50 bg-white/95 backdrop-blur-sm border-b border-slate-200">
            <div className="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center text-white font-bold">
                  AI
                </div>
                <div>
                  <div className="font-semibold text-slate-900">{CONFIG.company.name}</div>
                  <div className="text-xs text-slate-500">{CONFIG.company.tagline}</div>
                </div>
              </div>
              <div className="hidden md:flex items-center gap-6 text-sm">
                <a href="#how-it-works" className="text-slate-600 hover:text-indigo-600">How It Works</a>
                <a href="#use-cases" className="text-slate-600 hover:text-indigo-600">Use Cases</a>
                <a href="#pricing" className="text-slate-600 hover:text-indigo-600">Pricing</a>
                <a href={phoneLink} className="px-4 py-2 rounded-lg border border-slate-200 hover:border-indigo-600 hover:text-indigo-600">📞 Call</a>
                <a href={whatsappLink} target="_blank" rel="noopener noreferrer" className="px-4 py-2 rounded-lg bg-green-600 text-white hover:bg-green-700">💬 WhatsApp</a>
              </div>
              <div className="md:hidden flex gap-2">
                <a href={phoneLink} className="px-3 py-2 rounded-lg border border-slate-200 text-sm">📞</a>
                <a href={whatsappLink} target="_blank" rel="noopener noreferrer" className="px-3 py-2 rounded-lg bg-green-600 text-white text-sm">💬</a>
              </div>
            </div>
          </header>
          
          {/* Main Content */}
          <main className="max-w-6xl mx-auto px-6 py-12">
            {/* Hero Section */}
            <section className="grid lg:grid-cols-2 gap-12 items-center mb-20">
              <div>
                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-50 text-indigo-600 text-sm font-medium mb-6">
                  <span className="relative flex h-2 w-2">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                    <span className="relative inline-flex rounded-full h-2 w-2 bg-indigo-500"></span>
                  </span>
                  {CONFIG.hero.badge}
                </div>
                
                <h1 className="text-5xl font-extrabold leading-tight mb-6 bg-gradient-to-r from-slate-900 to-slate-600 bg-clip-text text-transparent">
                  {CONFIG.hero.heading}
                </h1>
                
                <p className="text-lg text-slate-600 mb-8">
                  {CONFIG.hero.subheading}
                </p>
                
                <div className="flex flex-wrap gap-4 mb-8">
                  <a href={phoneLink} className="px-6 py-3 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold shadow-lg">
                    {CONFIG.hero.ctaPrimary}
                  </a>
                  <a href={whatsappLink} target="_blank" rel="noopener noreferrer" className="px-6 py-3 rounded-lg border-2 border-green-600 text-green-600 hover:bg-green-50 font-semibold">
                    {CONFIG.hero.ctaSecondary}
                  </a>
                </div>
                
                <div className="grid grid-cols-2 gap-4 mb-6">
                  {CONFIG.hero.keyFeatures.map((feature, i) => (
                    <div key={i} className="flex items-start gap-2">
                      <span className="text-green-500 font-bold text-lg">✓</span>
                      <div className="text-sm"><strong>{feature.title}</strong><br/><span className="text-slate-500">{feature.subtitle}</span></div>
                    </div>
                  ))}
                </div>
                
                <div className="p-4 rounded-lg bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200">
                  <div className="flex items-center gap-3">
                    <span className="text-2xl">🎉</span>
                    <div className="text-sm">
                      <div className="font-semibold text-amber-900">{CONFIG.hero.trust.title}</div>
                      <div className="text-amber-700">{CONFIG.hero.trust.subtitle}</div>
                    </div>
                  </div>
                </div>
              </div>
              
              <div className="rounded-2xl p-6 shadow-xl bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 border border-indigo-100">
                <div className="rounded-xl border-2 border-indigo-200 p-5 bg-white">
                  <div className="flex items-center justify-between mb-4">
                    <div className="text-sm font-semibold flex items-center gap-2">
                      <span className="text-lg">📱</span> Incoming Call
                    </div>
                    <div className="flex items-center gap-2 text-sm text-green-600 font-semibold">
                      <span className="relative flex h-2 w-2">
                        <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                        <span className="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                      </span>
                      AI Answering
                    </div>
                  </div>
                  
                  <div className="mb-3 p-3 rounded-lg bg-slate-50 border border-slate-100">
                    <div className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">Caller</div>
                    <div className="text-sm font-medium">+91 98765 43210</div>
                    <div className="text-xs text-slate-500 mt-1">Mumbai, Maharashtra</div>
                  </div>
                  
                  <div className="space-y-3">
                    <div className="p-3 rounded-lg bg-blue-50 border border-blue-100 text-sm">
                      <div className="font-medium text-blue-900 mb-1">👤 Customer:</div>
                      <div className="text-blue-800">"Hello, I want to book an appointment for tomorrow at 3 PM"</div>
                    </div>
                    
                    <div className="p-3 rounded-lg bg-indigo-50 border border-indigo-100 text-sm">
                      <div className="font-medium text-indigo-900 mb-1">🤖 AIgenetic:</div>
                      <div className="text-indigo-800">"Sure! Let me check availability... Yes, 3 PM tomorrow is available. Shall I book it for you?"</div>
                    </div>
                    
                    <div className="p-3 rounded-lg bg-blue-50 border border-blue-100 text-sm">
                      <div className="font-medium text-blue-900 mb-1">👤 Customer:</div>
                      <div className="text-blue-800">"Yes, please"</div>
                    </div>
                    
                    <div className="p-3 rounded-lg bg-green-50 border border-green-100 text-sm">
                      <div className="font-medium text-green-900 mb-1">✅ AIgenetic:</div>
                      <div className="text-green-800">"Perfect! Your appointment is confirmed for tomorrow at 3 PM. You'll receive a confirmation shortly. Thank you!"</div>
                    </div>
                  </div>
                  
                  <div className="mt-4 pt-3 border-t border-slate-200 flex items-center justify-between text-xs text-slate-500">
                    <span>Call Duration: 1m 42s</span>
                    <span className="px-2 py-1 rounded bg-green-100 text-green-700 font-medium">✓ Appointment Booked</span>
                  </div>
                </div>
              </div>
            </section>
            
            {/* How It Works */}
            <section id="how-it-works" className="mb-20">
              <div className="text-center max-w-2xl mx-auto mb-12">
                <h2 className="text-3xl font-bold mb-4">How It Works</h2>
                <p className="text-lg text-slate-600">A simple, reliable 5-step flow that works in Indian languages and accents</p>
              </div>
              
              <div className="relative mb-8">
                <div className="hidden lg:block absolute top-16 left-0 right-0 h-0.5 bg-gradient-to-r from-indigo-200 via-purple-200 to-pink-200"></div>
                
                <div className="grid md:grid-cols-5 gap-6">
                  {CONFIG.howItWorks.map((item, i) => (
                    <div key={i} className="relative">
                      <div className="bg-white rounded-2xl p-6 shadow-lg border border-slate-100 hover:shadow-xl transition-all h-full relative z-10">
                        <div className={`inline-flex items-center justify-center w-12 h-12 rounded-full bg-gradient-to-br ${item.color} text-white font-bold text-xl mb-4`}>
                          {item.step}
                        </div>
                        <div className="text-4xl mb-3">{item.icon}</div>
                        <div className="font-bold text-lg mb-2">{item.title}</div>
                        <div className="text-sm text-slate-600">{item.desc}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
              
              <div className="p-6 rounded-2xl bg-gradient-to-r from-indigo-50 to-purple-50 border border-indigo-100">
                <div className="flex flex-col md:flex-row items-center gap-4">
                  <div className="text-4xl">⚡</div>
                  <div className="flex-1 text-center md:text-left">
                    <div className="font-bold text-lg">Average Call Duration: Under 2 Minutes</div>
                    <div className="text-slate-600 mt-1">Fast, efficient, and natural conversations</div>
                  </div>
                  <a href="#demo" className="px-6 py-3 rounded-lg bg-indigo-600 text-white font-semibold hover:bg-indigo-700 whitespace-nowrap">
                    See It In Action
                  </a>
                </div>
              </div>
            </section>
            
            {/* Use Cases */}
            <section id="use-cases" className="mb-20">
              <div className="text-center max-w-2xl mx-auto mb-12">
                <h2 className="text-3xl font-bold mb-4">Built for Indian Businesses</h2>
                <p className="text-lg text-slate-600">Trusted by SMEs across industries</p>
              </div>
              
              <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                {CONFIG.useCases.map((useCase, i) => (
                  <div key={i} className="group p-6 rounded-2xl border border-slate-100 bg-white shadow-sm hover:shadow-xl transition-all hover:-translate-y-1">
                    <div className={`inline-flex items-center justify-center w-14 h-14 rounded-xl bg-gradient-to-br ${useCase.gradient} text-white text-2xl mb-4 group-hover:scale-110 transition-transform`}>
                      {useCase.icon}
                    </div>
                    <div className="text-xl font-bold mb-2">{useCase.title}</div>
                    <div className="text-sm text-slate-600 mb-4">{useCase.desc}</div>
                    <ul className="space-y-1">
                      {useCase.features.map((feature, j) => (
                        <li key={j} className="text-xs text-slate-500 flex items-start gap-2">
                          <span className="text-green-500 font-bold">✓</span>
                          <span>{feature}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                ))}
              </div>
              
              <div className="p-6 rounded-xl bg-slate-50 border border-slate-100 text-center text-sm">
                <span className="font-semibold text-slate-700">Also perfect for:</span> Consultants • Fitness Centers • Lawyers • Financial Advisors • Diagnostic Labs • Coaching Centers
              </div>
            </section>
            
            {/* Why AIgenetic */}
            <section className="mb-20">
              <div className="text-center max-w-2xl mx-auto mb-12">
                <h2 className="text-3xl font-bold mb-4">Why Choose AIgenetic</h2>
                <p className="text-lg text-slate-600">The only fully managed AI phone service for Indian SMEs</p>
              </div>
              
              <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                {CONFIG.usps.map((usp, i) => (
                  <div key={i} className="group p-6 rounded-2xl border border-slate-100 bg-white shadow-sm hover:shadow-xl transition-all hover:-translate-y-1">
                    <div className={`inline-flex items-center justify-center w-12 h-12 rounded-xl bg-gradient-to-br ${usp.gradient} text-white text-2xl mb-3 group-hover:scale-110 transition-transform`}>
                      {usp.icon}
                    </div>
                    <div className="font-bold text-lg mb-2">{usp.title}</div>
                    <div className="text-sm text-slate-600">{usp.desc}</div>
                  </div>
                ))}
              </div>
            </section>
            
            {/* Testimonials & Stats */}
            <section className="mb-20">
              <div className="text-center max-w-2xl mx-auto mb-12">
                <h2 className="text-3xl font-bold mb-4">Trusted by 100+ Indian Businesses</h2>
                <p className="text-lg text-slate-600">See how AIgenetic is transforming customer communication</p>
              </div>
              
              <div className="grid md:grid-cols-3 gap-6 mb-12">
                {CONFIG.testimonials.map((testimonial, i) => (
                  <div key={i} className="p-6 rounded-2xl border border-slate-100 bg-white shadow-sm hover:shadow-lg transition-shadow">
                    <div className="flex gap-1 mb-3">
                      {[...Array(5)].map((_, j) => (
                        <span key={j} className="text-yellow-400 text-lg">★</span>
                      ))}
                    </div>
                    <p className="text-sm leading-relaxed mb-4 text-slate-700">"{testimonial.quote}"</p>
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center text-white font-bold">
                        {testimonial.name.charAt(0)}
                      </div>
                      <div>
                        <div className="font-semibold text-sm">{testimonial.name}</div>
                        <div className="text-xs text-slate-500">{testimonial.role}</div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
              
              <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                {CONFIG.stats.map((stat, i) => (
                  <div key={i} className={`text-center p-6 rounded-xl bg-gradient-to-br ${stat.color} border`}>
                    <div className={`text-3xl font-bold`}>{stat.number}</div>
                    <div className="text-sm text-slate-600 mt-1">{stat.label}</div>
                  </div>
                ))}
              </div>
            </section>
            
            {/* Pricing */}
            <section id="pricing" className="mb-20">
              <div className="text-center max-w-2xl mx-auto mb-12">
                <h2 className="text-3xl font-bold mb-4">Simple, Transparent Pricing</h2>
                <p className="text-lg text-slate-600">No hidden fees. Pay only for what you use.</p>
              </div>
              
              <div className="grid lg:grid-cols-3 gap-6 max-w-5xl mx-auto mb-8">
                {CONFIG.pricing.map((plan, i) => (
                  <div key={i} className={`p-6 rounded-2xl border-2 ${plan.highlighted ? 'border-indigo-500 bg-gradient-to-br from-indigo-50 to-purple-50 shadow-xl scale-105' : 'border-slate-200 bg-white shadow-sm'} relative`}>
                    {plan.badge && (
                      <div className="absolute -top-4 left-1/2 -translate-x-1/2 px-4 py-1 rounded-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white text-sm font-semibold">
                        {plan.badge}
                      </div>
                    )}
                    <div className="text-sm font-semibold text-indigo-600 uppercase tracking-wide mb-2">{plan.name}</div>
                    <div className="text-3xl font-bold mb-1">{plan.price}<span className="text-lg font-normal text-slate-500">{plan.period}</span></div>
                    <div className="text-sm text-slate-600 mb-6">{plan.usage}</div>
                    <ul className="space-y-3 mb-6">
                      {plan.features.map((feature, j) => (
                        <li key={j} className="flex items-start gap-2 text-sm">
                          <span className="text-green-500 font-bold">✓</span>
                          <span className="text-slate-700">{feature}</span>
                        </li>
                      ))}
                    </ul>
                    <a href={plan.name === 'Enterprise' ? whatsappLink : phoneLink} target={plan.name === 'Enterprise' ? '_blank' : undefined} rel={plan.name === 'Enterprise' ? 'noopener noreferrer' : undefined} className={`block w-full text-center px-4 py-3 rounded-lg font-semibold transition-colors ${plan.highlighted ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white hover:from-indigo-700 hover:to-purple-700 shadow-lg' : 'border-2 border-indigo-600 text-indigo-600 hover:bg-indigo-50'}`}>
                      {plan.cta}
                    </a>
                  </div>
                ))}
              </div>
              
              <div className="p-6 rounded-xl bg-amber-50 border border-amber-200 max-w-3xl mx-auto">
                <div className="flex items-start gap-3">
                  <span className="text-2xl">💡</span>
                  <div>
                    <div className="font-semibold text-amber-900 mb-1">{CONFIG.ctaMessages.pricingHelp.title}</div>
                    <div className="text-sm text-amber-800 mb-3">{CONFIG.ctaMessages.pricingHelp.description}</div>
                    <a href={whatsappLink} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-green-600 text-white text-sm font-semibold hover:bg-green-700">
                      💬 Chat on WhatsApp
                    </a>
                  </div>
                </div>
              </div>
            </section>
            
            {/* Contact Form */}
            <section id="demo" className="mb-20">
              <div className="text-center max-w-2xl mx-auto mb-12">
                <h2 className="text-3xl font-bold mb-4">{CONFIG.ctaMessages.demoForm.heading}</h2>
                <p className="text-lg text-slate-600">{CONFIG.ctaMessages.demoForm.subheading}</p>
              </div>
              
              <div className="max-w-2xl mx-auto">
                <form onSubmit={submitForm} className="p-8 rounded-2xl bg-gradient-to-br from-indigo-50 to-purple-50 border-2 border-indigo-100 shadow-xl">
                  <div className="grid md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-medium mb-2">Your Name *</label>
                      <input required name="name" value={form.name} onChange={handleChange} placeholder="Enter your name" className="w-full p-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium mb-2">Business Name *</label>
                      <input required name="business" value={form.business} onChange={handleChange} placeholder="Your business name" className="w-full p-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium mb-2">Phone Number *</label>
                      <input required name="phone" value={form.phone} onChange={handleChange} placeholder="+91 98765 43210" className="w-full p-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium mb-2">City</label>
                      <input name="city" value={form.city} onChange={handleChange} placeholder="Mumbai, Delhi, etc." className="w-full p-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none" />
                    </div>
                    <div className="md:col-span-2">
                      <label className="block text-sm font-medium mb-2">Preferred Demo Time</label>
                      <input name="time" value={form.time} onChange={handleChange} placeholder="e.g., Tomorrow 3 PM, Any weekday morning" className="w-full p-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none" />
                    </div>
                  </div>
                  
                  <div className="mt-6 flex flex-col sm:flex-row items-center gap-3">
                    <button type="submit" className="w-full sm:flex-1 px-6 py-3 rounded-lg bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold hover:from-indigo-700 hover:to-purple-700 shadow-lg">
                      📧 Request Demo via Email
                    </button>
                    <span className="text-slate-500 text-sm">or</span>
                    <a href={phoneLink} className="w-full sm:w-auto px-6 py-3 rounded-lg border-2 border-indigo-600 text-indigo-600 font-semibold hover:bg-indigo-50 whitespace-nowrap">
                      📞 Call Now
                    </a>
                    <a href={whatsappLink} target="_blank" rel="noopener noreferrer" className="w-full sm:w-auto px-6 py-3 rounded-lg bg-green-600 text-white font-semibold hover:bg-green-700 whitespace-nowrap">
                      💬 WhatsApp
                    </a>
                  </div>
                  
                  <div className="mt-4 text-center text-sm text-slate-600">
                    {CONFIG.ctaMessages.demoForm.responseTime}
                  </div>
                </form>
              </div>
            </section>
          </main>
          
          {/* Footer */}
          <footer className="bg-slate-50 border-t border-slate-200">
            <div className="max-w-6xl mx-auto px-6 py-12">
              <div className="grid md:grid-cols-4 gap-8 mb-8">
                <div className="md:col-span-2">
                  <div className="flex items-center gap-3 mb-4">
                    <div className="w-12 h-12 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center text-white font-bold text-xl">
                      AI
                    </div>
                    <div>
                      <div className="font-bold text-lg">{CONFIG.company.name}</div>
                      <div className="text-sm text-slate-600">{CONFIG.company.tagline}</div>
                    </div>
                  </div>
                  <p className="text-sm text-slate-600 leading-relaxed mb-4">
                    {CONFIG.company.legalName} provides fully managed AI-powered phone assistants for Indian SMEs. 
                    We handle customer calls 24/7, book appointments, and help businesses never miss an opportunity.
                  </p>
                  <div className="flex gap-3">
                    <a href={phoneLink} className="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700">
                      📞 Call
                    </a>
                    <a href={whatsappLink} target="_blank" rel="noopener noreferrer" className="px-4 py-2 rounded-lg bg-green-600 text-white text-sm font-semibold hover:bg-green-700">
                      💬 WhatsApp
                    </a>
                  </div>
                </div>
                
                <div>
                  <div className="font-semibold mb-4">Quick Links</div>
                  <ul className="space-y-2 text-sm text-slate-600">
                    <li><a href="#" className="hover:text-indigo-600">Home</a></li>
                    <li><a href="#how-it-works" className="hover:text-indigo-600">How It Works</a></li>
                    <li><a href="#pricing" className="hover:text-indigo-600">Pricing</a></li>
                    <li><a href="#demo" className="hover:text-indigo-600">Book Demo</a></li>
                  </ul>
                </div>
                
                <div>
                  <div className="font-semibold mb-4">Contact</div>
                  <ul className="space-y-2 text-sm text-slate-600">
                    <li className="flex items-start gap-2">
                      <span>📧</span>
                      <a href={`mailto:${CONFIG.company.email}`} className="hover:text-indigo-600">{CONFIG.company.email}</a>
                    </li>
                    <li className="flex items-start gap-2">
                      <span>📞</span>
                      <a href={phoneLink} className="hover:text-indigo-600">{CONFIG.company.phoneDisplay}</a>
                    </li>
                    <li className="flex items-start gap-2">
                      <span>💬</span>
                      <a href={whatsappLink} target="_blank" rel="noopener noreferrer" className="hover:text-indigo-600">WhatsApp Support</a>
                    </li>
                    <li className="flex items-start gap-2">
                      <span>🏢</span>
                      <span>{CONFIG.company.location}</span>
                    </li>
                  </ul>
                </div>
              </div>
              
              <div className="pt-8 border-t border-slate-200 flex flex-col md:flex-row items-center justify-between gap-4 text-sm text-slate-600">
                <div>© 2026 {CONFIG.company.legalName}. All rights reserved.</div>
                <div className="flex gap-6">
                  <a href="#" className="hover:text-indigo-600">Privacy Policy</a>
                  <a href="#" className="hover:text-indigo-600">Terms of Service</a>
                  <a href="#" className="hover:text-indigo-600">Refund Policy</a>
                </div>
              </div>
              
              <div className="mt-8 pt-8 border-t border-slate-200 flex flex-wrap items-center justify-center gap-6 text-xs text-slate-500">
                <div className="flex items-center gap-2">
                  <span>✓</span>
                  <span>TRAI Compliant</span>
                </div>
                <div className="flex items-center gap-2">
                  <span>🔒</span>
                  <span>SSL Secured</span>
                </div>
                <div className="flex items-center gap-2">
                  <span>🇮🇳</span>
                  <span>Made in India</span>
                </div>
                <div className="flex items-center gap-2">
                  <span>🏆</span>
                  <span>ISO Certified</span>
                </div>
              </div>
            </div>
          </footer>
          
          {/* Floating Action Buttons */}
          <div className="fixed bottom-6 right-6 flex flex-col gap-3 z-50">
            <a href={whatsappLinkWithText} 
               target="_blank" 
               rel="noopener noreferrer"
               className="flex items-center justify-center w-14 h-14 rounded-full bg-green-600 text-white shadow-lg hover:bg-green-700 hover:scale-110 transition-all"
               title="WhatsApp us">
              <span className="text-2xl">💬</span>
            </a>
            <a href={phoneLink} 
               className="flex items-center justify-center w-14 h-14 rounded-full bg-indigo-600 text-white shadow-lg hover:bg-indigo-700 hover:scale-110 transition-all"
               title="Call us">
              <span className="text-2xl">📞</span>
            </a>
          </div>
        </div>
      );
    }
    
    ReactDOM.createRoot(document.getElementById('root')).render(<AIgeneticLanding />);
  </script>
</body>
</html>
